# backoffice(platform ns)가 data ns 의 vault-indexer 인덱싱 Job 을 즉시 생성할 수 있게 하는
# 최소 권한 RBAC. Discord /index, /api/admin/vault/reindex 에서 사용.
# 권한 범위: data ns 의 cronjobs(get) + jobs(create/list/get) 만.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backoffice
  namespace: platform
  labels:
    app.kubernetes.io/name: backoffice
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-indexer-trigger
  namespace: data
  labels:
    app.kubernetes.io/name: backoffice
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backoffice-vault-indexer-trigger
  namespace: data
  labels:
    app.kubernetes.io/name: backoffice
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-indexer-trigger
subjects:
  - kind: ServiceAccount
    name: backoffice
    namespace: platform
