# trusted operator가 승인 후 적용한다. 앱은 고정 요청 하나만 patch할 수 있다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backoffice
  namespace: platform
  labels:
    app.kubernetes.io/name: backoffice
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-index-request
  namespace: data
data: {}
---
# 완료 상태는 앱이 바꿀 수 없다. 최초 생성 후 재배포 시 data를 덮어쓰지 않는다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-index-state
  namespace: data
data: {}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-indexer-trigger
  namespace: data
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["vault-index-request"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backoffice-vault-indexer-trigger
  namespace: data
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-indexer-trigger
subjects:
  - kind: ServiceAccount
    name: backoffice
    namespace: platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-indexer
  namespace: data
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-indexer-state
  namespace: data
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["vault-index-request", "vault-index-state"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["vault-index-state"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-indexer-state
  namespace: data
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-indexer-state
subjects:
  - kind: ServiceAccount
    name: vault-indexer
    namespace: data
