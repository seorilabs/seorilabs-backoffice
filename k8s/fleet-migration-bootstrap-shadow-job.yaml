# P7 production BOOTSTRAP collector one-shot. web Deployment(768Mi) 안에서 실행하지
# 않으며 Job/Pod UID를 durable occurrence에 결합한다. deploy-backoffice는 자동 적용하지 않는다.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: backoffice-fleet-bootstrap-__BACKOFFICE_IMAGE_TAG_SHORT__-
  namespace: platform
  labels:
    app.kubernetes.io/name: backoffice
    app.kubernetes.io/component: fleet-migration-bootstrap-shadow
    seorilabs.dev/source-sha: "__BACKOFFICE_IMAGE_TAG__"
spec:
  # immutable image/source/detector/resources readback 전에는 Pod를 만들지 않는다.
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backoffice
        app.kubernetes.io/component: fleet-migration-bootstrap-shadow
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: rpi5
      imagePullSecrets:
        - name: registry-pull-cred
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: bootstrap-shadow
          image: registry.vzyx.xyz/seorilabs/seorilabs-backoffice:latest
          imagePullPolicy: Always
          command: ["node", "/app/scripts-dist/fleet-migration-bootstrap-shadow.cjs"]
          env:
            - name: NODE_ENV
              value: production
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1536 --expose-gc"
            - name: HOME
              value: /tmp
            - name: CHECKPOINT_DISABLE
              value: "1"
            - name: GITHUB_ORG
              value: seorilabs
            - name: BACKOFFICE_SOURCE_SHA
              value: "__BACKOFFICE_IMAGE_TAG__"
            - name: FLEET_MIGRATION_DETECTOR_SOURCE_SHA
              value: "__FLEET_MIGRATION_DETECTOR_SOURCE_SHA__"
            - name: FLEET_MIGRATION_JOB_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['batch.kubernetes.io/controller-uid']
            - name: FLEET_MIGRATION_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: CONTROL_PLANE_SNAPSHOT_SIGNING_KEY_ID
              value: control-plane-snapshot-v1
            - name: CONTROL_PLANE_SNAPSHOT_SIGNATURE_POLICY_REVISION
              value: snapshot-policy-v1
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: DATABASE_URL
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: GITHUB_APP_ID
            - name: GITHUB_PRIVATE_KEY_FILE
              value: /run/secrets/github/private-key
            - name: CONTROL_PLANE_SNAPSHOT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: backoffice-control-plane-snapshot-signing
                  key: CONTROL_PLANE_SNAPSHOT_SIGNING_KEY
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: github-private-key
              mountPath: /run/secrets/github
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: github-private-key
          secret:
            secretName: backoffice-secrets
            defaultMode: 0440
            items:
              - key: GITHUB_PRIVATE_KEY
                path: private-key
        - name: tmp
          emptyDir: {}
