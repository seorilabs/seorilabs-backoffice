# Google Play/App Store 사용자 리뷰 수집. API 자격증명은 이 CronJob에만 주입하고,
# Discord Bot token은 notification worker에만 둔다. 첫 성공 실행은 기준선만 만든다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backoffice-store-reviews
  namespace: platform
  labels:
    app.kubernetes.io/name: backoffice
    app.kubernetes.io/component: store-review-collector
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backoffice
            app.kubernetes.io/component: store-review-collector
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: rpi5
          imagePullSecrets:
            - name: registry-pull-cred
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          containers:
            - name: collector
              image: registry.vzyx.xyz/seorilabs/seorilabs-backoffice:latest
              imagePullPolicy: Always
              workingDir: /app
              command: ["node", "/app/scripts-dist/store-review-collector.cjs"]
              env:
                - { name: NODE_ENV, value: production }
                - { name: HOME, value: /tmp }
                - { name: CHECKPOINT_DISABLE, value: "1" }
                - { name: NODE_OPTIONS, value: "--dns-result-order=ipv4first --no-network-family-autoselection" }
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: backoffice-secrets
                      key: DATABASE_URL
                - name: DISCORD_CHANNEL_USER_REVIEWS_ID
                  valueFrom:
                    secretKeyRef:
                      name: backoffice-secrets
                      key: DISCORD_CHANNEL_USER_REVIEWS_ID
                      optional: true
                - name: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
                  valueFrom:
                    secretKeyRef:
                      name: backoffice-secrets
                      key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
                      optional: true
                - name: APP_STORE_CONNECT_API_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: backoffice-secrets
                      key: APP_STORE_CONNECT_API_KEY_ID
                      optional: true
                - name: APP_STORE_CONNECT_ISSUER_ID
                  valueFrom:
                    secretKeyRef:
                      name: backoffice-secrets
                      key: APP_STORE_CONNECT_ISSUER_ID
                      optional: true
                - name: APP_STORE_CONNECT_PRIVATE_KEY_BASE64
                  valueFrom:
                    secretKeyRef:
                      name: backoffice-secrets
                      key: APP_STORE_CONNECT_PRIVATE_KEY_BASE64
                      optional: true
              resources:
                requests: { cpu: 25m, memory: 128Mi }
                limits: { cpu: 500m, memory: 384Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: tmp
              emptyDir: {}
