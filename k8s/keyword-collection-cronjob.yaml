# 승인 설계 f0c855f: 07:20, 13:20, 20:20 KST. Play 광고 원문 검증 전 비활성.
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/component: operations-insights-collector
    app.kubernetes.io/name: backoffice
  name: backoffice-keyword-collection
  namespace: platform
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 4200
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/component: operations-insights-collector
            app.kubernetes.io/name: backoffice
        spec:
          automountServiceAccountToken: false
          containers:
            - command:
                - node
                - /app/scripts-dist/operations-insights-worker.cjs
                - keywords
              env:
                - name: NODE_ENV
                  value: production
                - name: HOME
                  value: /tmp
                - name: CHECKPOINT_DISABLE
                  value: "1"
                - name: NODE_OPTIONS
                  value: --dns-result-order=ipv4first --no-network-family-autoselection
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      key: DATABASE_URL
                      name: backoffice-secrets
                - name: BACKOFFICE_SOURCE_SHA
                  value: __BACKOFFICE_IMAGE_TAG__
                - name: KEYWORD_PLAY_ENABLED
                  value: "false"
              image: registry.vzyx.xyz/seorilabs/seorilabs-backoffice:latest
              imagePullPolicy: Always
              name: keywords
              resources:
                limits:
                  cpu: 500m
                  memory: 384Mi
                requests:
                  cpu: 25m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - mountPath: /tmp
                  name: tmp
              workingDir: /app
          imagePullSecrets:
            - name: registry-pull-cred
          nodeSelector:
            kubernetes.io/hostname: rpi5
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 10001
            runAsGroup: 10001
            runAsUser: 10001
          volumes:
            - emptyDir: {}
              name: tmp
  schedule: 20 22,4,11 * * *
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 2
  suspend: false
