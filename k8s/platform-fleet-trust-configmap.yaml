---
# Platform Fleet 릴리스 승인 서명 공개키 registry. 공개 데이터(keyId, SPKI PEM)만 담는다.
# 개인키 원본은 ~/.config/seorilabs 카탈로그의 shared/platform/fleet-release-approval-signing에만
# 있고 Backoffice로 넘기지 않는다. Backoffice web은 이 key를
# PLATFORM_FLEET_APPROVAL_PUBLIC_KEYS_JSON으로 읽어 seorilabs/platform 릴리스의
# fleet-approved.json 서명을 검증한 뒤에만 PlatformRelease를 기록한다.
# 정본은 seorilabs/platform의 .github/platform-fleet-trusted-release-keys.json이며
# 여기에는 같은 공개키만 복제한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backoffice-platform-fleet-trust
  namespace: platform
data:
  trusted-release-keys.json: |
    {
      "schemaVersion": 1,
      "keys": [
        {
          "algorithm": "Ed25519",
          "keyId": "platform-fleet-release-20260829-5458c56b",
          "publicKeyPem": "-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEAv9bZ2dkImHKEyU9O2Sr/DG0rcbf3nh0qH24DGsWl1xQ=\n-----END PUBLIC KEY-----\n",
          "status": "ACTIVE"
        }
      ]
    }
