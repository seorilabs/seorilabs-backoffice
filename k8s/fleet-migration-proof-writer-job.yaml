# Trusted operator가 signed public request ConfigMap을 준비한 뒤 실행하는 INSERT-only
# proof writer다. production DB URL, GitHub token, HMAC/private signing key는 받지 않는다.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: backoffice-fleet-proof-__BACKOFFICE_IMAGE_TAG_SHORT__-
  namespace: platform
  labels:
    app.kubernetes.io/name: backoffice
    app.kubernetes.io/component: fleet-migration-proof-writer
    seorilabs.dev/source-sha: "__BACKOFFICE_IMAGE_TAG__"
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backoffice
        app.kubernetes.io/component: fleet-migration-proof-writer
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: rpi5
      imagePullSecrets:
        - name: registry-pull-cred
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: proof-writer
          image: registry.vzyx.xyz/seorilabs/seorilabs-backoffice:latest
          imagePullPolicy: Always
          command: ["node", "/app/scripts-dist/fleet-migration-proof-writer.cjs"]
          env:
            - { name: NODE_ENV, value: production }
            - { name: NODE_OPTIONS, value: "--max-old-space-size=768" }
            - { name: HOME, value: /tmp }
            - { name: CHECKPOINT_DISABLE, value: "1" }
            - { name: PROOF_REQUEST_ROOT, value: /run/fleet-proof/public }
            - { name: PROOF_REQUEST_FILE, value: proof-write-request.json }
            - { name: APPROVAL_PUBLIC_KEY_ROOT, value: /run/fleet-proof/public }
            - { name: APPROVAL_PUBLIC_KEY_FILE, value: approval-public.pem }
            - { name: APPROVAL_KEY_ID, value: fleet-migration-proof-approval-v1 }
            - { name: APPROVAL_KEY_FINGERPRINT, value: "__FLEET_MIGRATION_PROOF_APPROVAL_KEY_FINGERPRINT__" }
            - { name: APPROVAL_POLICY_REVISION, value: fleet-migration-proof-policy-v1 }
            - { name: SNAPSHOT_SIGNING_KEY_ID, value: control-plane-snapshot-v1 }
            - { name: SNAPSHOT_POLICY_REVISION, value: snapshot-policy-v1 }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fleet-migration-proof-writer-db
                  key: DATABASE_URL
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: proof-public-request, mountPath: /run/fleet-proof/public, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: proof-public-request
          projected:
            defaultMode: 0440
            sources:
              - configMap:
                  name: "__FLEET_MIGRATION_PROOF_REQUEST_CONFIG_MAP__"
                  items:
                    - { key: proof-write-request.json, path: proof-write-request.json }
                    - { key: approval-public.pem, path: approval-public.pem }
        - name: tmp
          emptyDir: { sizeLimit: 32Mi }
