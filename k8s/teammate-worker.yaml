# AI 팀원 Gateway 워커. 팀원 봇 4개의 Discord Gateway WebSocket 연결을 프로세스
# 하나로 유지하고(멘션 대화), teammate_run 순찰 큐를 소화한다.
# FEATURE_DISCORD_TEAMMATES=false + optional secret 이라 자격증명 없이 배포해도
# idle 상태로만 남는다. 활성화는 SealedSecret 키 투입 후 플래그 전환으로 한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backoffice-teammate-worker
  namespace: platform
  labels:
    app.kubernetes.io/name: backoffice
    app.kubernetes.io/component: teammate-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backoffice
      app.kubernetes.io/component: teammate-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backoffice
        app.kubernetes.io/component: teammate-worker
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: rpi5
      imagePullSecrets:
        - name: registry-pull-cred
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: teammate-worker
          image: registry.vzyx.xyz/seorilabs/seorilabs-backoffice:latest
          imagePullPolicy: Always
          workingDir: /app
          command: ["node", "/app/scripts-dist/teammate-worker.cjs"]
          env:
            - { name: NODE_ENV, value: production }
            - { name: HOME, value: /tmp }
            # 클러스터에 IPv6 egress 가 없어 Happy Eyeballs 가 discord.com AAAA 로
            # 타임아웃된다. 웹 배포와 동일한 플래그가 상시 WSS 연결에도 필요하다.
            - { name: NODE_OPTIONS, value: "--dns-result-order=ipv4first --no-network-family-autoselection" }
            - { name: FEATURE_DISCORD_TEAMMATES, value: "false" }
            - { name: FEATURE_GEMINI_ENABLED, value: "true" }
            - { name: GEMINI_CHAT_MODEL, value: gemini-3.1-flash-lite }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DATABASE_URL } }
            - name: DISCORD_GUILD_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_GUILD_ID } }
            # 순찰 이슈 초안의 confirm 카드는 메인 봇 정체로 게시한다.
            - name: DISCORD_BOT_TOKEN
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_BOT_TOKEN } }
            - name: DISCORD_CHANNEL_BACKOFFICE_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_CHANNEL_BACKOFFICE_ID } }
            - name: DISCORD_CHANNEL_METRICS_DAILY_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_CHANNEL_METRICS_DAILY_ID } }
            - name: DISCORD_CHANNEL_OPS_ALERTS_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_CHANNEL_OPS_ALERTS_ID } }
            - name: DISCORD_CHANNEL_RELEASE_OPS_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_CHANNEL_RELEASE_OPS_ID } }
            # 순찰 dedupe 는 open/closed GitHub 이슈를 교차 조회한다.
            - name: GITHUB_APP_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: GITHUB_APP_ID } }
            - name: GITHUB_PRIVATE_KEY
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: GITHUB_PRIVATE_KEY } }
            - name: GEMINI_API_KEY
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: GEMINI_API_KEY } }
            # 팀원 봇 자격증명(role 당 APPLICATION_ID, BOT_TOKEN). Phase 0 완료 전에는
            # 키가 없으므로 전부 optional — 미설정 팀원은 워커가 건너뛴다.
            - name: DISCORD_TEAMMATE_PRODUCT_APPLICATION_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_TEAMMATE_PRODUCT_APPLICATION_ID, optional: true } }
            - name: DISCORD_TEAMMATE_PRODUCT_BOT_TOKEN
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_TEAMMATE_PRODUCT_BOT_TOKEN, optional: true } }
            - name: DISCORD_TEAMMATE_DATA_APPLICATION_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_TEAMMATE_DATA_APPLICATION_ID, optional: true } }
            - name: DISCORD_TEAMMATE_DATA_BOT_TOKEN
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_TEAMMATE_DATA_BOT_TOKEN, optional: true } }
            - name: DISCORD_TEAMMATE_DEVELOPMENT_APPLICATION_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_TEAMMATE_DEVELOPMENT_APPLICATION_ID, optional: true } }
            - name: DISCORD_TEAMMATE_DEVELOPMENT_BOT_TOKEN
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_TEAMMATE_DEVELOPMENT_BOT_TOKEN, optional: true } }
            - name: DISCORD_TEAMMATE_QA_APPLICATION_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_TEAMMATE_QA_APPLICATION_ID, optional: true } }
            - name: DISCORD_TEAMMATE_QA_BOT_TOKEN
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_TEAMMATE_QA_BOT_TOKEN, optional: true } }
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
