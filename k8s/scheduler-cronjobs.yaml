# 웹 프로세스에 있던 reconcile/Xcode Cloud/registry seed scheduler를 분리한다.
# 같은 CronJob의 이전 실행이 끝나지 않았으면 다음 실행을 건너뛰며, 각 API 작업은
# DB/GitHub 원장의 멱등 계약을 유지한다. deploy workflow는 웹 rollout 뒤 catch-up보다
# 먼저 적용하며, 배포 실패 중에도 CronJob을 delete 또는 suspend하지 않는다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backoffice-repository-discovery-backfill
  namespace: platform
  labels:
    app.kubernetes.io/name: backoffice
    app.kubernetes.io/component: scheduler
spec:
  schedule: "7 * * * *"
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backoffice
            app.kubernetes.io/component: repository-discovery-backfill
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 10001
          nodeSelector:
            kubernetes.io/hostname: rpi5
          containers:
            - name: trigger
              image: curlimages/curl@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - >-
                  token="$(cat /var/run/secrets/seorilabs/admin-token)" &&
                  printf 'header = "x-admin-token: %s"\n' "$token" |
                  curl --config - -fsS -o /dev/null --max-time 840 -XPOST
                  http://backoffice.platform.svc.cluster.local/api/admin/repository-discovery/backfill
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                runAsUser: 10001
                runAsGroup: 10001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: admin-token
                  mountPath: /var/run/secrets/seorilabs
                  readOnly: true
          volumes:
            - name: admin-token
              secret:
                secretName: backoffice-secrets
                defaultMode: 0440
                items:
                  - key: INTERNAL_ADMIN_TOKEN
                    path: admin-token
---
