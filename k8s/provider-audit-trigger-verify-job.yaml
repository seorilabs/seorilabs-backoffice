# 배포마다 실행하는 read-only append-only trigger 검증 gate다.
# app migration principal에는 대상 table의 TRIGGER 권한이 없어
# information_schema.TRIGGERS가 빈 결과로 보이므로, 가시성이 있는 전용 principal로
# 존재와 정의만 SELECT한다. DDL, GRANT, 복구, 데이터 변경을 하지 않는다.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: backoffice-provider-audit-trigger-verify-__BACKOFFICE_IMAGE_TAG_SHORT__-
  namespace: data
  labels:
    app.kubernetes.io/name: backoffice
    app.kubernetes.io/component: provider-audit-trigger-verify
    seorilabs.dev/source-sha: "__BACKOFFICE_IMAGE_TAG__"
  annotations:
    seorilabs.dev/migration: "20260828230000_provider_execution_queue"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backoffice
        app.kubernetes.io/component: provider-audit-trigger-verify
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: rpi5
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: verify
          image: mysql@sha256:0596fa224cdf3b3355ce3ddbfd7ce77be27ec9e51841dfc5d2e1c8b81eea69d2
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              ulimit -c 0
              umask 077
              printf '[client]\nuser=root\npassword=%s\nhost=mysql.data.svc.cluster.local\n' \
                "$(< /run/secrets/mysql-root-password)" > /tmp/verify.cnf
              q() {
                mysql --defaults-extra-file=/tmp/verify.cnf --batch --skip-column-names -e "$1"
              }
              # 보호 table 위의 trigger는 계약된 두 개뿐이어야 한다. 우회 trigger가
              # 함께 설치되면 append-only가 무력화되므로 총 개수도 확인한다.
              total="$(q "SELECT COUNT(*) FROM information_schema.TRIGGERS \
                WHERE TRIGGER_SCHEMA='backoffice' \
                  AND EVENT_OBJECT_TABLE='control_plane_provider_execution_event'")"
              # 이름, timing, event, table, action statement가 모두 정확히 일치하는 것만 센다.
              # MySQL은 client가 보낸 statement를 그대로 보관하므로 trailing ';'만 정규화한다.
              exact="$(q "SELECT COUNT(*) FROM information_schema.TRIGGERS \
                WHERE TRIGGER_SCHEMA='backoffice' \
                  AND EVENT_OBJECT_TABLE='control_plane_provider_execution_event' \
                  AND ACTION_TIMING='BEFORE' \
                  AND TRIM(TRAILING ';' FROM TRIM(ACTION_STATEMENT)) = \
                      \"SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'provider execution audit is append-only'\" \
                  AND ( \
                    (TRIGGER_NAME='control_plane_provider_execution_event_no_update' AND EVENT_MANIPULATION='UPDATE') \
                    OR (TRIGGER_NAME='control_plane_provider_execution_event_no_delete' AND EVENT_MANIPULATION='DELETE') \
                  )")"
              if [ "$total" != "2" ] || [ "$exact" != "2" ]; then
                echo "provider audit trigger 계약 실패: total=${total} exact=${exact}" >&2
                exit 1
              fi
              echo "provider audit triggers verified: total=2 exact=2"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: mysql-root-password
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: mysql-root-password
          secret:
            secretName: mysql-root-cred
            defaultMode: 0440
            items:
              - key: password
                path: mysql-root-password
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
