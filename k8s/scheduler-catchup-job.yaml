# 웹과 worker가 exact digest로 전환되고 정기 CronJob desired state를 확인한 뒤,
# 작업을 직렬 실행한다. repository discovery는 enqueue, provider readback drain,
# desired-state DRAFT 순서를 fail-closed로 고정한다. 정기 실행과 겹치더라도 endpoint의 durable
# idempotency/CAS가 한 번만 반영하며, 응답 body는 로그에 남기지 않는다.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: backoffice-scheduler-catchup-__BACKOFFICE_IMAGE_TAG_SHORT__-
  namespace: platform
  labels:
    app.kubernetes.io/name: backoffice
    app.kubernetes.io/component: scheduler-catchup
    seorilabs.dev/source-sha: "__BACKOFFICE_IMAGE_TAG__"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3300
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backoffice
        app.kubernetes.io/component: scheduler-catchup
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
      nodeSelector:
        kubernetes.io/hostname: rpi5
      containers:
        - name: trigger
          image: curlimages/curl@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ceu
            - |
              failed=0
              source_sha="__BACKOFFICE_IMAGE_TAG__"
              expected_backfill_contract="desired-state-safe-source-rebase/v3"
              token="$(cat /var/run/secrets/seorilabs/admin-token)"
              call() {
                label="$1"
                shift
                status=""
                if status="$(printf 'header = "x-admin-token: %s"\n' "$token" | \
                  curl --config - -sS -o /dev/null -w '%{http_code}' "$@")"; then
                  case "$status" in
                    2??) echo "$label=ok" ;;
                    409) echo "$label=busy" ;;
                    *)
                      echo "$label=failed_http_$status" >&2
                      failed=1
                      ;;
                  esac
                else
                  echo "$label=failed_transport" >&2
                  failed=1
                fi
              }
              call_required() {
                label="$1"
                shift
                status=""
                if status="$(printf 'header = "x-admin-token: %s"\n' "$token" | \
                  curl --config - -sS -o /dev/null -w '%{http_code}' "$@")"; then
                  case "$status" in
                    2??) echo "$label=ok" ;;
                    *)
                      echo "$label=failed_http_$status" >&2
                      return 1
                      ;;
                  esac
                else
                  echo "$label=failed_transport" >&2
                  return 1
                fi
              }
              desired_state_backfill() {
                response_headers=""
                if ! response_headers="$(printf 'header = "x-admin-token: %s"\n' "$token" | \
                  curl --config - -sS -D - -o /dev/null \
                    -w 'x-seorilabs-http-status:%{http_code}\n' \
                    --max-time 600 -XPOST \
                    -H 'x-seorilabs-backfill-trigger: deploy-catch-up' \
                    -H 'x-seorilabs-source-sha: __BACKOFFICE_IMAGE_TAG__' \
                    http://backoffice.platform.svc.cluster.local/api/admin/desired-state/backfill)"; then
                  echo "desired_state_backfill=failed_transport" >&2
                  return 1
                fi
                header_value() {
                  expected="$1"
                  printf '%s\n' "$response_headers" | awk -v expected="$expected" '
                    {
                      line = $0
                      sub(/\r$/, "", line)
                      colon = index(line, ":")
                      if (colon > 0 && tolower(substr(line, 1, colon - 1)) == expected) {
                        value = substr(line, colon + 1)
                        sub(/^[ \t]+/, "", value)
                      }
                    }
                    END { print value }
                  '
                }
                status="$(header_value x-seorilabs-http-status)"
                run_id="$(header_value x-seorilabs-backfill-run-id)"
                contract="$(header_value x-seorilabs-backfill-contract-version)"
                trigger="$(header_value x-seorilabs-backfill-trigger)"
                observed_sha="$(header_value x-seorilabs-backfill-source-sha)"
                run_status="$(header_value x-seorilabs-backfill-status)"
                failed_count="$(header_value x-seorilabs-backfill-failed)"
                case "$status" in
                  2??) ;;
                  *) echo "desired_state_backfill=failed_http" >&2; return 1 ;;
                esac
                case "$run_id" in
                  ""|*[!A-Za-z0-9_-]*) echo "desired_state_backfill=invalid_readback" >&2; return 1 ;;
                esac
                if [ "$contract" != "$expected_backfill_contract" ] ||
                   [ "$trigger" != DEPLOY_CATCH_UP ] ||
                   [ "$observed_sha" != "$source_sha" ] ||
                   [ "$run_status" != COMPLETED ] ||
                   [ "$failed_count" != 0 ]; then
                  echo "desired_state_backfill=invalid_readback" >&2
                  return 1
                fi
                {
                  printf 'runId=%s\n' "$run_id"
                  printf 'contractVersion=%s\n' "$contract"
                  printf 'trigger=%s\n' "$trigger"
                  printf 'sourceSha=%s\n' "$observed_sha"
                  printf 'status=%s\n' "$run_status"
                  printf 'failed=%s\n' "$failed_count"
                } > /dev/termination-log
                echo "desired_state_backfill=ok"
              }
              call reconcile --max-time 840 -XPOST \
                http://backoffice.platform.svc.cluster.local/api/admin/reconcile
              call_required repository_discovery_backfill --max-time 600 -XPOST \
                http://backoffice.platform.svc.cluster.local/api/admin/repository-discovery/backfill
              call_required repository_discovery_drain --max-time 840 -XPOST \
                http://backoffice.platform.svc.cluster.local/api/admin/repository-discovery/drain
              desired_state_backfill
              call xcode_cloud_sync --max-time 300 -XPOST \
                http://backoffice.platform.svc.cluster.local/api/admin/xcode-cloud/sync
              call registry_seed --max-time 300 -XPOST \
                -H "content-type: application/json" \
                --data '{"backfill":false}' \
                http://backoffice.platform.svc.cluster.local/api/admin/seed
              call platform_fleet --max-time 50 -XPOST \
                http://backoffice.platform.svc.cluster.local/api/admin/automation/platform-fleet
              call fleet_project_projection --max-time 50 -XPOST \
                http://backoffice.platform.svc.cluster.local/api/admin/automation/project-projections
              exit "$failed"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: admin-token
              mountPath: /var/run/secrets/seorilabs
              readOnly: true
      volumes:
        - name: admin-token
          secret:
            secretName: backoffice-secrets
            defaultMode: 0440
            items:
              - key: INTERNAL_ADMIN_TOKEN
                path: admin-token
