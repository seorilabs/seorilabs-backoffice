# GA4 지표 보고서 — 앱별 노트를 Obsidian(프로젝트/지표)에 큐잉 + Telegram 요약.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backoffice-analytics-report
  namespace: platform
  labels:
    app.kubernetes.io/name: backoffice
spec:
  schedule: "30 1 * * *" # 매일 01:30 UTC = 10:30 KST (수집 30분 뒤 = 늦게 착지하는 export 안전 버퍼)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 180
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: trigger
              image: curlimages/curl:8.11.1
              command:
                - sh
                - -c
                - >-
                  curl -fsS --max-time 150 -XPOST
                  -H "x-admin-token: $ADMIN_TOKEN"
                  http://backoffice.platform.svc.cluster.local/api/admin/analytics/report
              env:
                - name: ADMIN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: backoffice-secrets
                      key: INTERNAL_ADMIN_TOKEN
              securityContext:
                runAsUser: 10001
                runAsGroup: 10001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
