# 서리 일일 지표 하이라이트·로우라이트 + Org 종합 보고서 발행 — GA4·AppsInToss 콘솔
# 스냅샷에서 크게 움직인 항목만 추려 #app-ops 에 남기고, 같은 계산 결과를 OrgReportDaily
# 스냅샷(백오피스 /report)으로 저장한다. analytics-collect(10:00 KST)와 지표 리포트
# (10:30 KST) 뒤에 돌아야 D-1 스냅샷이 이미 들어와 있다.
# 시간 예산: 종량제 비용 4소스(각 15s timeout) + LLM 해설이 얹혀 여유를 둔다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backoffice-metric-highlights
  namespace: platform
  labels:
    app.kubernetes.io/name: backoffice
spec:
  schedule: "0 2 * * *" # 02:00 UTC = 11:00 KST
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: trigger
              image: curlimages/curl:8.11.1
              command:
                - sh
                - -c
                - >-
                  curl -fsS --max-time 280 -XPOST
                  -H "x-admin-token: $ADMIN_TOKEN"
                  http://backoffice.platform.svc.cluster.local/api/admin/metric-highlights
              env:
                - name: ADMIN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: backoffice-secrets
                      key: INTERNAL_ADMIN_TOKEN
              securityContext:
                runAsUser: 10001
                runAsGroup: 10001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
---
# AppsInToss 콘솔 푸시(21:30 KST) 이후·다음 날 metric-daily(10:30 KST) 발행 전 마지막
# GA4 재집계. Discord 발송이나 종합 보고서 발행은 하지 않고 AppMetricDaily 만 갱신한다.
# 정상 케이스에선 10:00 KST analytics-collect 와 동일한 결과지만, 늦게 도착하는 export 가
# 있으면 이 시점에 한 번 더 덮어쓴다.
