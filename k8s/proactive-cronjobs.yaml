# Godot 버전 감지 — 최신 stable 이 pin(GODOT_PINNED_VERSION)보다 높으면 Discord 알림.
# 코드/설정 bump 는 하지 않음(감지+알림 전용). global-versions.yaml 미러링.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backoffice-godot-version-check
  namespace: platform
  labels:
    app.kubernetes.io/name: backoffice
spec:
  schedule: "0 1 * * 1" # 매주 월 01:00 UTC = 월 10:00 KST
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: trigger
              image: curlimages/curl:8.11.1
              command:
                - sh
                - -c
                - >-
                  curl -fsS --max-time 90 -XPOST
                  -H "x-admin-token: $ADMIN_TOKEN"
                  http://backoffice.platform.svc.cluster.local/api/admin/godot-version-check
              env:
                - name: ADMIN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: backoffice-secrets
                      key: INTERNAL_ADMIN_TOKEN
              securityContext:
                runAsUser: 10001
                runAsGroup: 10001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
# 컨텐츠 세부 지표 수집(스펙 구동, 모든 게임 통합)은 별도 매니페스트
