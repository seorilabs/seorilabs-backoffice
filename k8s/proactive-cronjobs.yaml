  namespace: platform
  labels:
    app.kubernetes.io/name: backoffice
spec:
  schedule: "0 1 * * *" # 매일 01:00 UTC = 10:00 KST (GA4 일별 export 착지 직후 = 가장 빠른 D-1)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 330
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: trigger
              image: curlimages/curl:8.11.1
              command:
                - sh
                - -c
                - >-
                  curl -fsS --max-time 300 -XPOST
                  -H "x-admin-token: $ADMIN_TOKEN"
                  http://backoffice.platform.svc.cluster.local/api/admin/analytics/collect
              env:
                - name: ADMIN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: backoffice-secrets
                      key: INTERNAL_ADMIN_TOKEN
              securityContext:
                runAsUser: 10001
                runAsGroup: 10001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
