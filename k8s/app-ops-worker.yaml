apiVersion: apps/v1
kind: Deployment
metadata:
  name: backoffice-app-ops-worker
  namespace: platform
  labels:
    app.kubernetes.io/name: backoffice
    app.kubernetes.io/component: app-ops-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backoffice
      app.kubernetes.io/component: app-ops-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backoffice
        app.kubernetes.io/component: app-ops-worker
    spec:
      serviceAccountName: backoffice
      nodeSelector:
        kubernetes.io/hostname: rpi5
      imagePullSecrets:
        - name: registry-pull-cred
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: app-ops-worker
          image: registry.vzyx.xyz/seorilabs/seorilabs-backoffice:latest
          imagePullPolicy: Always
          workingDir: /app
          command: ["node", "/app/scripts-dist/app-ops-worker.cjs"]
          env:
            - name: NODE_ENV
              value: production
            - name: HOME
              value: /tmp
            - name: CHECKPOINT_DISABLE
              value: "1"
            - name: APP_OPS_POLL_INTERVAL_MS
              value: "1000"
            # 세 전제가 모두 갖춰져 전환했다. 하나라도 빠지면 화면은
            # 뜨지만 실행이 막힌다.
            #
            #   레지스트리   features.iap + iap.entitlement_ids
            #   카탈로그     IAP_CATALOG_JSON 에 같은 entitlement
            #   자격증명     PLATFORM_ADMIN_WRITE_SA_KEY_JSON (worker 전용)
            #
            # 레지스트리는 repo 파일을 고치는 것만으로 반영되지 않는다.
            # platform 저장소에서 cmd/regsync 를 사람이 돌려야 한다.
            # 실제로 features.iap 가 false 인 채 남아 결제는 되는데 IAP
            # 관리만 403이었다.
            - name: FEATURE_PLATFORM_ADMIN
              value: "true"
            # 웹과 worker에서 같은 시점에 바꾼다. 웹만 켜면 worker가
            # mutation을 집지 않고, worker만 켜면 접수 경로가 없다.
            - name: FEATURE_PLATFORM_ADMIN_WRITES
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: DATABASE_URL
            - name: LIZARD_TYCOON_APP_OPS_SA_KEY_JSON
              valueFrom:
                secretKeyRef:
                  name: backoffice-app-ops-secrets
                  key: LIZARD_TYCOON_APP_OPS_SA_KEY_JSON
            # 플랫폼 mutation은 write 전용 invoker로만 실행한다.
            - name: PLATFORM_ADMIN_URL
              valueFrom:
                secretKeyRef:
                  name: backoffice-app-ops-secrets
                  key: PLATFORM_ADMIN_URL
                  optional: true
            - name: PLATFORM_ADMIN_WRITE_SA_KEY_JSON
              valueFrom:
                secretKeyRef:
                  name: backoffice-app-ops-secrets
                  key: PLATFORM_ADMIN_WRITE_SA_KEY_JSON
                  optional: true
            - name: APP_STORE_CONNECT_API_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: APP_STORE_CONNECT_API_KEY_ID
            - name: APP_STORE_CONNECT_ISSUER_ID
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: APP_STORE_CONNECT_ISSUER_ID
            - name: APP_STORE_CONNECT_PRIVATE_KEY_BASE64
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: APP_STORE_CONNECT_PRIVATE_KEY_BASE64
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
