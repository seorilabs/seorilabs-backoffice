apiVersion: apps/v1
kind: Deployment
metadata:
  name: backoffice-app-ops-worker
  namespace: platform
  labels:
    app.kubernetes.io/name: backoffice
    app.kubernetes.io/component: app-ops-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backoffice
      app.kubernetes.io/component: app-ops-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backoffice
        app.kubernetes.io/component: app-ops-worker
    spec:
      serviceAccountName: backoffice
      nodeSelector:
        kubernetes.io/hostname: rpi5
      imagePullSecrets:
        - name: registry-pull-cred
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: app-ops-worker
          image: registry.vzyx.xyz/seorilabs/seorilabs-backoffice:latest
          imagePullPolicy: Always
          workingDir: /app
          command: ["node", "/app/scripts-dist/app-ops-worker.cjs"]
          env:
            - name: NODE_ENV
              value: production
            - name: HOME
              value: /tmp
            - name: CHECKPOINT_DISABLE
              value: "1"
            - name: APP_OPS_POLL_INTERVAL_MS
              value: "1000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: DATABASE_URL
            - name: LIZARD_TYCOON_APP_OPS_SA_KEY_JSON
              valueFrom:
                secretKeyRef:
                  name: backoffice-app-ops-secrets
                  key: LIZARD_TYCOON_APP_OPS_SA_KEY_JSON
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
