# 공식 분석 보고서 수집. 봇·워크플로우 실행 토큰은 주입하지 않는다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backoffice-extended-metrics
  namespace: platform
  labels:
    app.kubernetes.io/name: backoffice
    app.kubernetes.io/component: extended-metrics-collector
spec:
  schedule: "0 1 * * *" # 10:00 한국 시간
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 2700
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backoffice
            app.kubernetes.io/component: extended-metrics-collector
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: rpi5
          imagePullSecrets:
            - name: registry-pull-cred
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          containers:
            - name: collector
              image: registry.vzyx.xyz/seorilabs/seorilabs-backoffice:latest
              imagePullPolicy: Always
              terminationMessagePolicy: FallbackToLogsOnError
              workingDir: /app
              command: ["node", "/app/scripts-dist/extended-metrics-collector.cjs"]
              env:
                - { name: NODE_ENV, value: production }
                - { name: HOME, value: /tmp }
                - { name: CHECKPOINT_DISABLE, value: "1" }
                - { name: NODE_OPTIONS, value: "--dns-result-order=ipv4first --no-network-family-autoselection" }
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: backoffice-secrets
                      key: DATABASE_URL
                - name: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
                  valueFrom:
                    secretKeyRef:
                      name: backoffice-secrets
                      key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
                      optional: true
                - name: APP_STORE_CONNECT_API_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: backoffice-secrets
                      key: APP_STORE_CONNECT_API_KEY_ID
                      optional: true
                - name: APP_STORE_CONNECT_ISSUER_ID
                  valueFrom:
                    secretKeyRef:
                      name: backoffice-secrets
                      key: APP_STORE_CONNECT_ISSUER_ID
                      optional: true
                - name: APP_STORE_CONNECT_PRIVATE_KEY_BASE64
                  valueFrom:
                    secretKeyRef:
                      name: backoffice-secrets
                      key: APP_STORE_CONNECT_PRIVATE_KEY_BASE64
                      optional: true
                - name: ADMOB_REPORTING_OAUTH_JSON
                  valueFrom:
                    secretKeyRef:
                      name: backoffice-secrets
                      key: ADMOB_REPORTING_OAUTH_JSON
                      optional: true
              resources:
                requests: { cpu: 25m, memory: 128Mi }
                limits: { cpu: 500m, memory: 768Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: tmp
              emptyDir: {}
