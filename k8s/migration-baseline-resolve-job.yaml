# 운영 baseline cutover 전용 one-shot Job. 자동 deploy 대상이 아니다.
# 최종 PR HEAD에서 빌드한 immutable image digest로 render한 뒤 trusted operator가 실행한다.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: backoffice-baseline-resolve-__BACKOFFICE_IMAGE_TAG_SHORT__-
  namespace: platform
  labels:
    app.kubernetes.io/name: backoffice
    app.kubernetes.io/component: migration-baseline-resolve
    seorilabs.dev/source-sha: "__BACKOFFICE_IMAGE_TAG__"
  annotations:
    seorilabs.dev/baseline-sha256: "3f6490cca6bf5043519c534a8fde27361ae3f8a87c62de3162b649eaaca27f53"
    seorilabs.dev/legacy-ledger-sha256: "9904c8010ddee8e10801a7b6426c7a522f68362d693ed8e953a7459bc2bd4cbc"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 2592000
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backoffice
        app.kubernetes.io/component: migration-baseline-resolve
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: rpi5
      imagePullSecrets:
        - name: registry-pull-cred
      securityContext:
        fsGroup: 10001
      containers:
        - name: resolve
          image: registry.vzyx.xyz/seorilabs/seorilabs-backoffice:latest
          imagePullPolicy: Always
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              ulimit -c 0
              test "$(sha256sum prisma/migrations/00000000000000_squashed_migrations/migration.sql | awk '{print $1}')" = \
                "3f6490cca6bf5043519c534a8fde27361ae3f8a87c62de3162b649eaaca27f53"
              test "$(sha256sum prisma/migration-archive/production-ledger-v1.tsv | awk '{print $1}')" = \
                "9904c8010ddee8e10801a7b6426c7a522f68362d693ed8e953a7459bc2bd4cbc"
              node scripts-dist/verify-migration-state.cjs \
                --history=legacy --print-data-fingerprint
              prisma migrate resolve \
                --applied 00000000000000_squashed_migrations
              node scripts-dist/verify-migration-state.cjs \
                --history=cutover --print-data-fingerprint
              test "$(node scripts-dist/verify-migration-state.cjs \
                --history=predeploy --expected-lineage=cutover)" = cutover
              prisma migrate deploy
              prisma migrate status
              prisma migrate diff \
                --from-schema-datasource prisma/schema.prisma \
                --to-schema-datamodel prisma/schema.prisma \
                --exit-code
          env:
            - name: HOME
              value: /tmp
            - name: CHECKPOINT_DISABLE
              value: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
