# platform/ci-deployer가 data ns의 기존 Vault CronJob 두 개의 이미지 SHA만 갱신한다.
# create/delete/list 권한과 Secret/PVC 권한은 주지 않는다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backoffice-image-deployer
  namespace: data
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: ["vault-indexer", "vault-writer"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backoffice-image-deployer
  namespace: data
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backoffice-image-deployer
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: platform
