# 예시 템플릿. 실제 값은 커밋하지 말 것 — `kubectl create secret` 또는 sealed-secrets 로 주입.
#
# 예) kubectl -n platform create secret generic backoffice-secrets \
#   --from-literal=DATABASE_URL='mysql://backoffice:<PW>@mysql.data.svc.cluster.local:3306/backoffice?connection_limit=5' \
#   --from-literal=DB_PASSWORD='<PW>' \
#   --from-literal=AUTH_SECRET="$(openssl rand -base64 33)" \
#   --from-literal=AUTH_GITHUB_ID='<oauth client id>' \
#   --from-literal=AUTH_GITHUB_SECRET='<oauth client secret>' \
#   --from-literal=GITHUB_APP_ID='<app id>' \
#   --from-file=GITHUB_PRIVATE_KEY=./backoffice-app.private-key.pem \
#   --from-literal=GITHUB_WEBHOOK_SECRET='<webhook secret>' \
#   --from-literal=INTERNAL_ADMIN_TOKEN="$(openssl rand -hex 24)" \
#   --from-literal=GEMINI_API_KEY=''
apiVersion: v1
kind: Secret
metadata:
  name: backoffice-secrets
  namespace: platform
type: Opaque
stringData:
  DATABASE_URL: "mysql://backoffice:CHANGEME@mysql.data.svc.cluster.local:3306/backoffice?connection_limit=5"
  DB_PASSWORD: "CHANGEME"
  AUTH_SECRET: "CHANGEME-openssl-rand-base64-33"
  AUTH_GITHUB_ID: ""
  AUTH_GITHUB_SECRET: ""
  GITHUB_APP_ID: ""
  GITHUB_PRIVATE_KEY: |
    -----BEGIN RSA PRIVATE KEY-----
    CHANGEME
    -----END RSA PRIVATE KEY-----
  GITHUB_WEBHOOK_SECRET: ""
  INTERNAL_ADMIN_TOKEN: "CHANGEME-openssl-rand-hex-24"
  GEMINI_API_KEY: ""
  # App Store Connect API 팀 키 (Xcode Cloud iOS 빌드 트리거용, optional)
  # PRIVATE_KEY_BASE64 = AuthKey_*.p8 PEM 의 base64 (한 줄)
  APP_STORE_CONNECT_API_KEY_ID: ""
  APP_STORE_CONNECT_ISSUER_ID: ""
  APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ""
