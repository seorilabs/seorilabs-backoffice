# 예시 템플릿. 실제 값은 커밋하지 말 것 — `kubectl create secret` 또는 sealed-secrets 로 주입.
#
# 예) kubectl -n platform create secret generic backoffice-secrets \
#   --from-literal=DATABASE_URL='mysql://backoffice:<PW>@mysql.data.svc.cluster.local:3306/backoffice?connection_limit=5' \
#   --from-literal=DB_PASSWORD='<PW>' \
#   --from-literal=AUTH_SECRET="$(openssl rand -base64 33)" \
#   --from-literal=AUTH_GITHUB_ID='<oauth client id>' \
#   --from-literal=AUTH_GITHUB_SECRET='<oauth client secret>' \
#   --from-literal=GITHUB_APP_ID='<app id>' \
#   --from-file=GITHUB_PRIVATE_KEY=./backoffice-app.private-key.pem \
#   --from-literal=GITHUB_WEBHOOK_SECRET='<webhook secret>' \
#   --from-literal=INTERNAL_ADMIN_TOKEN="$(openssl rand -hex 24)" \
#   --from-literal=GEMINI_API_KEY=''
apiVersion: v1
kind: Secret
metadata:
  name: backoffice-secrets
  namespace: platform
type: Opaque
stringData:
  DATABASE_URL: "mysql://backoffice:CHANGEME@mysql.data.svc.cluster.local:3306/backoffice?connection_limit=5"
  DB_PASSWORD: "CHANGEME"
  AUTH_SECRET: "CHANGEME-openssl-rand-base64-33"
  AUTH_GITHUB_ID: ""
  AUTH_GITHUB_SECRET: ""
  GITHUB_APP_ID: ""
  GITHUB_PRIVATE_KEY: |
    -----BEGIN RSA PRIVATE KEY-----
    CHANGEME
    -----END RSA PRIVATE KEY-----
  GITHUB_WEBHOOK_SECRET: ""
  INTERNAL_ADMIN_TOKEN: "CHANGEME-openssl-rand-hex-24"
  CONTROL_PLANE_ADMIN_TOKEN: "CHANGEME-openssl-rand-hex-32"
  AGENT_WORKER_CODEX_TOKEN: "CHANGEME-distinct-codex-capability"
  AGENT_WORKER_CLAUDE_TOKEN: "CHANGEME-distinct-claude-capability"
  AGENT_TRUSTED_ADAPTER_TOKEN: "CHANGEME-distinct-seori-auth-adapter-capability"
  AGENT_TRUSTED_ADAPTER_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    CHANGEME
    -----END PUBLIC KEY-----
  WORKFLOW_BUNDLE_CANDIDATE_ADAPTER_TOKEN: "CHANGEME-distinct-candidate-adapter-capability"
  WORKFLOW_BUNDLE_CANDIDATE_ADAPTER_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    CHANGEME-distinct-candidate-attestation-key
    -----END PUBLIC KEY-----
  GEMINI_API_KEY: ""
  # 공통 플랫폼 Admin API 조회 전용. 이 SA에는 platform-admin의
  # run.invoker(read allowlist) 외 프로젝트 권한을 부여하지 않는다.
  PLATFORM_ADMIN_URL: ""
  PLATFORM_ADMIN_READ_SA_KEY_JSON: ""
  DISCORD_APPLICATION_ID: ""
  DISCORD_PUBLIC_KEY: ""
  DISCORD_BOT_TOKEN: ""
  DISCORD_GUILD_ID: ""
  DISCORD_CHANNEL_BACKOFFICE_ID: ""
  DISCORD_CHANNEL_METRICS_DAILY_ID: ""
  DISCORD_CHANNEL_ACTION_EVENTS_ID: ""
  DISCORD_CHANNEL_RELEASE_OPS_ID: ""
  DISCORD_CHANNEL_OPS_ALERTS_ID: ""
  DISCORD_CHANNEL_SEORI_REVIEW_ID: ""
  DISCORD_CHANNEL_PRIVATE_FEED_ID: ""
  DISCORD_CHANNEL_FINANCE_ALERTS_ID: ""
  DISCORD_CHANNEL_USER_REVIEWS_ID: ""
  DISCORD_ROLE_OPERATIONS_ADMIN_ID: ""
  DISCORD_ROLE_OPERATOR_ID: ""
  DISCORD_ROLE_PRODUCT_ID: ""
  DISCORD_ROLE_DESIGN_ID: ""
  DISCORD_ROLE_DEVELOPMENT_ID: ""
  DISCORD_ROLE_QA_ID: ""
  DISCORD_ROLE_DATA_ID: ""
  DISCORD_ROLE_RELEASE_OPS_ID: ""
  DISCORD_ROLE_CS_ID: ""
  DISCORD_ROLE_VIEWER_ID: ""
  PLATFORM_EVENT_SHARED_SECRET: ""
  # Google Play Android Publisher API 리뷰 조회용 공용 publisher SA JSON.
  GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ""
  # App Store Connect API 팀 키 (Xcode Cloud iOS 빌드 트리거용, optional)
  # PRIVATE_KEY_BASE64 = AuthKey_*.p8 PEM 의 base64 (한 줄)
  APP_STORE_CONNECT_API_KEY_ID: ""
  APP_STORE_CONNECT_ISSUER_ID: ""
  APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ""
---
# ACTIVE ConfigRevision snapshot HMAC 전용. broad backoffice-secrets와 분리한다.
apiVersion: v1
kind: Secret
metadata:
  name: backoffice-control-plane-snapshot-signing
  namespace: platform
type: Opaque
stringData:
  CONTROL_PLANE_SNAPSHOT_SIGNING_KEY: "CHANGEME-openssl-rand-hex-32"
