# GA4 최근 5분 활성 사용자 표본 수집. 알림 전송은 공용 notification worker가 담당한다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backoffice-realtime-spike
  namespace: platform
  labels:
    app.kubernetes.io/name: backoffice
    app.kubernetes.io/component: realtime-spike-collector
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 240
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backoffice
            app.kubernetes.io/component: realtime-spike-collector
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: rpi5
          imagePullSecrets:
            - name: registry-pull-cred
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          containers:
            - name: collector
              image: registry.vzyx.xyz/seorilabs/seorilabs-backoffice:latest
              imagePullPolicy: Always
              workingDir: /app
              command: ["node", "/app/scripts-dist/realtime-spike-collector.cjs"]
              env:
                - { name: NODE_ENV, value: production }
                - { name: HOME, value: /tmp }
                - { name: CHECKPOINT_DISABLE, value: "1" }
                - { name: FEATURE_GA4_ANALYTICS, value: "true" }
                - name: DATABASE_URL
                  valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DATABASE_URL } }
                - name: GA4_SA_KEY_JSON
                  valueFrom: { secretKeyRef: { name: backoffice-secrets, key: GA4_SA_KEY_JSON } }
              resources:
                requests: { cpu: 25m, memory: 128Mi }
                limits: { cpu: 500m, memory: 384Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: tmp
              emptyDir: {}
