# backoffice 노출 리소스 — Service, ServiceMonitor, Ingress.
#
# deployment.yaml 에서 분리했다. CI 배포 SA(ci-deployer)에는 Deployment 와 CronJob
# write 권한만 있고 services/ingresses/servicemonitors 권한은 없다. 한 파일에 같이
# 있으면 apply 가 중간에 실패하므로, 예전 deploy.yml 은 deployment.yaml 을 아예
# apply 하지 않고 set image 로 이미지만 갱신했다.
#
# 그 결과 매니페스트에 적은 env 가 클러스터에 영영 가지 않았다.
# FEATURE_PLATFORM_ADMIN_WRITES 와 DAILY_DIGEST_GEMINI_ROLLOUT_PERCENT 가 실제로
# 그 상태였고, 파일만 보면 켜져 있는 줄 안다.
#
# 파일을 쪼개서 deployment.yaml 은 CI 가 선언적으로 적용하고, 이 파일은 수동
# apply 로 남긴다. 배포 SA 권한을 넓히지 않으려는 선택이다. 여기 값은 거의
# 바뀌지 않지만, 바꿨으면 아래를 직접 실행해야 반영된다.
#
#   kubectl apply -f k8s/backoffice-networking.yaml
#
# SealedSecret 과 인프라 매니페스트도 같은 수동 apply 대상이다.
apiVersion: v1
kind: Service
metadata:
  name: backoffice
  namespace: platform
  labels:
    app.kubernetes.io/name: backoffice
spec:
  selector:
    app.kubernetes.io/name: backoffice
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backoffice
  namespace: platform
  labels:
    app.kubernetes.io/name: backoffice
    release: rpi-monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: backoffice
  endpoints:
    - port: http
      path: /api/metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backoffice
  namespace: platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # GitHub webhook 대형 payload 대비 (raw-body HMAC 검증 안전).
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
spec:
  ingressClassName: public
  tls:
    - secretName: backoffice-vzyx-xyz-tls
      hosts:
        - backoffice.vzyx.xyz
  rules:
    - host: backoffice.vzyx.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backoffice
                port:
                  name: http
