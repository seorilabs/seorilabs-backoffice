# 영구 BuildKit 데몬 — ephemeral CI 러너가 remote 빌더로 접속.
# 캐시(pnpm store, .next/cache, 레이어)가 PVC 에 지속 → 증분 빌드.
# rpi4001(Pi4, 빌드 격리 노드)에 고정. privileged 필요.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buildkit-cache
  namespace: platform
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 25Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
  namespace: platform
  labels:
    app.kubernetes.io/name: buildkitd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: buildkitd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkitd
    spec:
      nodeSelector:
        kubernetes.io/hostname: rpi4001
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.18.2
          args:
            - --addr
            - unix:///run/buildkit/buildkitd.sock
            - --addr
            - tcp://0.0.0.0:1234
          # 클러스터 내부 전용(TLS 없음). NetworkPolicy 로 추가 격리 가능.
          securityContext:
            privileged: true
          ports:
            - name: buildkit
              containerPort: 1234
          readinessProbe:
            exec:
              command: ["buildctl", "debug", "workers"]
            initialDelaySeconds: 5
            periodSeconds: 30
          livenessProbe:
            exec:
              command: ["buildctl", "debug", "workers"]
            initialDelaySeconds: 10
            periodSeconds: 60
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "3500m"
              # 증분 빌드 캐시 로드 피크 대비 소폭 상향(제어플레인 노드라 보수적).
              # next build 힙은 Dockerfile NODE_OPTIONS 로 별도 상한.
              memory: 5Gi
          volumeMounts:
            - name: cache
              mountPath: /var/lib/buildkit
            - name: run
              mountPath: /run
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: buildkit-cache
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: buildkitd
  namespace: platform
  labels:
    app.kubernetes.io/name: buildkitd
spec:
  selector:
    app.kubernetes.io/name: buildkitd
  ports:
    - name: buildkit
      port: 1234
      targetPort: buildkit
