# 20260828230000_provider_execution_queue가 두 audit trigger에서만 멈춘 경우의
# trusted-operator one-shot 복구다. 전역 MySQL 설정이나 app user 권한은 바꾸지 않는다.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: backoffice-provider-audit-triggers-__BACKOFFICE_IMAGE_TAG_SHORT__-
  namespace: data
  labels:
    app.kubernetes.io/name: backoffice
    app.kubernetes.io/component: provider-audit-trigger-recovery
    seorilabs.dev/source-sha: "__BACKOFFICE_IMAGE_TAG__"
  annotations:
    seorilabs.dev/migration: "20260828230000_provider_execution_queue"
    seorilabs.dev/migration-sha256: "f4e7711ecd3e0c92105640498d17bbc1606801b957febe5c871260f7e7a7cbeb"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 2592000
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backoffice
        app.kubernetes.io/component: provider-audit-trigger-recovery
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: rpi5
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: install
          image: mysql@sha256:0596fa224cdf3b3355ce3ddbfd7ce77be27ec9e51841dfc5d2e1c8b81eea69d2
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              ulimit -c 0
              umask 077
              printf '[client]\nuser=root\npassword=%s\nhost=mysql.data.svc.cluster.local\n' \
                "$(< /run/secrets/mysql-root-password)" > /tmp/root.cnf
              tables="$(mysql --defaults-extra-file=/tmp/root.cnf --batch --skip-column-names -e \
                "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='backoffice' AND TABLE_NAME IN ('control_plane_provider_execution','control_plane_provider_execution_event')")"
              test "$tables" = "2"
              installed="$(mysql --defaults-extra-file=/tmp/root.cnf --batch --skip-column-names -e \
                "SELECT COUNT(*) FROM information_schema.TRIGGERS WHERE TRIGGER_SCHEMA='backoffice' AND TRIGGER_NAME IN ('control_plane_provider_execution_event_no_update','control_plane_provider_execution_event_no_delete') AND ACTION_TIMING='BEFORE' AND ACTION_STATEMENT=\"SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'provider execution audit is append-only'\"")"
              if [ "$installed" = "2" ]; then
                echo "provider audit triggers already verified"
                exit 0
              fi
              test "$installed" = "0"
              events="$(mysql --defaults-extra-file=/tmp/root.cnf --batch --skip-column-names -e \
                "SELECT COUNT(*) FROM backoffice.control_plane_provider_execution_event")"
              test "$events" = "0"
              mysql --defaults-extra-file=/tmp/root.cnf backoffice <<'SQL'
              CREATE TRIGGER control_plane_provider_execution_event_no_update
              BEFORE UPDATE ON control_plane_provider_execution_event
              FOR EACH ROW SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'provider execution audit is append-only';
              CREATE TRIGGER control_plane_provider_execution_event_no_delete
              BEFORE DELETE ON control_plane_provider_execution_event
              FOR EACH ROW SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'provider execution audit is append-only';
              SQL
              installed="$(mysql --defaults-extra-file=/tmp/root.cnf --batch --skip-column-names -e \
                "SELECT COUNT(*) FROM information_schema.TRIGGERS WHERE TRIGGER_SCHEMA='backoffice' AND TRIGGER_NAME IN ('control_plane_provider_execution_event_no_update','control_plane_provider_execution_event_no_delete') AND ACTION_TIMING='BEFORE' AND ACTION_STATEMENT=\"SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'provider execution audit is append-only'\"")"
              test "$installed" = "2"
              echo "provider audit triggers installed and verified"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: mysql-root-password
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: mysql-root-password
          secret:
            secretName: mysql-root-cred
            defaultMode: 0440
            items:
              - key: password
                path: mysql-root-password
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
