apiVersion: apps/v1
kind: Deployment
metadata:
  name: backoffice
  namespace: platform
  labels:
    app.kubernetes.io/name: backoffice
spec:
  replicas: 1
  # 단일 replica + RWO 미러 DB. 스케줄러 중복/롤아웃 데드락 방지 위해 Recreate.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backoffice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backoffice
    spec:
      # data ns 인덱싱 Job 생성용(텔레그램 /index). RBAC: k8s/vault-trigger-rbac.yaml
      serviceAccountName: backoffice
      nodeSelector:
        kubernetes.io/hostname: rpi5
      securityContext:
        fsGroup: 10001
      imagePullSecrets:
        - name: registry-pull-cred
      initContainers:
        - name: migrate
          image: registry.vzyx.xyz/seorilabs/seorilabs-backoffice:latest
          imagePullPolicy: Always
          command: ["prisma", "migrate", "deploy"]
          env:
            - name: HOME
              value: /tmp
            - name: CHECKPOINT_DISABLE
              value: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: DATABASE_URL
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: backoffice
          image: registry.vzyx.xyz/seorilabs/seorilabs-backoffice:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            # --no-network-family-autoselection: pod 에 IPv6 egress 가 없는데 api.telegram.org 등이
            # AAAA 를 광고 → Node fetch 의 Happy Eyeballs 가 IPv6 를 시도하다 전체 연결을 ETIMEDOUT
            # 으로 실패시킨다. autoSelectFamily 를 끄고 IPv4 를 우선해 모든 outbound 를 IPv4 로 고정.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=640 --dns-result-order=ipv4first --no-network-family-autoselection"
            - name: HOME
              value: /tmp
            - name: CHECKPOINT_DISABLE
              value: "1"
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: AUTH_URL
              value: "https://backoffice.vzyx.xyz"
            - name: GITHUB_ORG
              value: seorilabs
            - name: ALLOWLIST_LOGINS
              value: "magicsih"
            - name: FEATURE_GEMINI_ENABLED
              value: "true"
            - name: GEMINI_API_BASE_URL
              value: "https://generativelanguage.googleapis.com/v1beta"
            - name: GEMINI_CHAT_MODEL
              value: "gemini-3.1-flash-lite"
            - name: GEMINI_CHAT_TIMEOUT_MS
              value: "180000"
            # 일일 병합 목록은 항상 발송. Gemini 한 줄 요약만 날짜별 10% 슬로우 롤아웃.
            - name: DAILY_DIGEST_GEMINI_ROLLOUT_PERCENT
              value: "10"
            - name: GEMINI_EMBED_MODEL
              value: "gemini-embedding-001"
            - name: GEMINI_EMBED_DIM
              value: "1536"
            - name: GEMINI_TIMEOUT_MS
              value: "60000"
            - name: RECONCILE_INTERVAL_MS
              value: "21600000"
            # GA4→BigQuery 지표 수집(수집/보고 CronJob + /analytics 대시보드).
            - name: FEATURE_GA4_ANALYTICS
              value: "true"
            # 공통 플랫폼 조회. 웹 Pod에는 read 전용 Cloud Run invoker만 둔다.
            # 쓰기 키는 backoffice-app-ops-worker에만 주입한다.
            - name: FEATURE_PLATFORM_ADMIN
              value: "true"
            # worker·registry·catalog가 모두 준비돼 전환했다.
            #
            # 이 플래그는 화면만 연다. 웹 Pod에는 read 키만 있어서 켜도
            # 원장을 직접 쓰지 못한다. 실제 mutation은 write 자격증명을
            # 가진 backoffice-app-ops-worker가 실행한다.
            #
            # worker의 같은 이름 두 플래그와 항상 같은 값을 유지한다.
            - name: FEATURE_PLATFORM_ADMIN_WRITES
              value: "true"
            - name: FEATURE_TELEGRAM_ENABLED
              value: "true"
            - name: TELEGRAM_ALLOWED_IDS
              value: "1366743545"
            - name: TELEGRAM_CHAT_ID
              value: "1366743545"
            # iOS(App Store)를 Xcode Cloud 로 빌드/업로드하는 repo allowlist(CSV).
            # 정책: 모든 App Store 배포는 App Store Connect(Xcode Cloud)로 → TestFlight 검증 → 심사 제출.
            # iOS 를 출시하는 repo 는 Xcode Cloud 제품/워크플로 준비되는 대로 이 목록에 추가한다.
            - name: XCODE_CLOUD_APP_STORE_REPOS
              value: "seorilabs/happy-farm,seorilabs/crossword-puzzle,seorilabs/foam-party,seorilabs/babycare,seorilabs/lucid-chess,seorilabs/cycle-pair"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: DATABASE_URL
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: AUTH_SECRET
            - name: AUTH_GITHUB_ID
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: AUTH_GITHUB_ID
            - name: AUTH_GITHUB_SECRET
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: AUTH_GITHUB_SECRET
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: GITHUB_APP_ID
            - name: GITHUB_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: GITHUB_PRIVATE_KEY
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: GITHUB_WEBHOOK_SECRET
            - name: INTERNAL_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: INTERNAL_ADMIN_TOKEN
            # 챗/초안 + 볼트 검색 질의 임베딩. 인덱서는 data ns 별도 키를 사용.
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: GEMINI_API_KEY
            # GA4 BigQuery 읽기 SA 키(JSON 전체). 없으면 지표 수집이 비활성.
            - name: GA4_SA_KEY_JSON
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: GA4_SA_KEY_JSON
                  optional: true
            - name: PLATFORM_ADMIN_URL
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: PLATFORM_ADMIN_URL
                  optional: true
            - name: PLATFORM_ADMIN_READ_SA_KEY_JSON
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: PLATFORM_ADMIN_READ_SA_KEY_JSON
                  optional: true
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: TELEGRAM_BOT_TOKEN
                  optional: true
            - name: TELEGRAM_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: TELEGRAM_WEBHOOK_SECRET
                  optional: true
            # App Store Connect API 팀 키(Xcode Cloud iOS 빌드 트리거용).
            - name: APP_STORE_CONNECT_API_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: APP_STORE_CONNECT_API_KEY_ID
                  optional: true
            - name: APP_STORE_CONNECT_ISSUER_ID
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: APP_STORE_CONNECT_ISSUER_ID
                  optional: true
            - name: APP_STORE_CONNECT_PRIVATE_KEY_BASE64
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: APP_STORE_CONNECT_PRIVATE_KEY_BASE64
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backoffice
  namespace: platform
  labels:
    app.kubernetes.io/name: backoffice
spec:
  selector:
    app.kubernetes.io/name: backoffice
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backoffice
  namespace: platform
  labels:
    app.kubernetes.io/name: backoffice
    release: rpi-monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: backoffice
  endpoints:
    - port: http
      path: /api/metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backoffice
  namespace: platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # GitHub webhook 대형 payload 대비 (raw-body HMAC 검증 안전).
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
spec:
  ingressClassName: public
  tls:
    - secretName: backoffice-vzyx-xyz-tls
      hosts:
        - backoffice.vzyx.xyz
  rules:
    - host: backoffice.vzyx.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backoffice
                port:
                  name: http
