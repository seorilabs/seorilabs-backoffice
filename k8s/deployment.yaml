# backoffice 웹 Deployment. CI(deploy.yml)가 선언적으로 apply 한다.
#
# Service·ServiceMonitor·Ingress 는 k8s/backoffice-networking.yaml 로 분리했다.
# 배포 SA 에 그 리소스 write 권한이 없어 한 파일이면 apply 가 실패한다.
# 그래서 예전에는 이 파일을 apply 하지 않고 set image 로 이미지만 갱신했고,
# 여기 적은 env 가 클러스터에 영영 가지 않았다.
#
# 이제 이 파일에 값을 적으면 다음 배포에 반영된다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backoffice
  namespace: platform
  labels:
    app.kubernetes.io/name: backoffice
spec:
  replicas: 1
  # DB migration은 별도 exact-digest Job이 먼저 끝낸다. 웹은 DB/PVC를 직접 점유하지
  # 않고 scheduler도 CronJob으로 분리했으므로 기존 Ready Pod를 남긴 채 교체한다.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 5
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app.kubernetes.io/name: backoffice
  template:
    metadata:
      annotations:
        seorilabs.dev/source-sha: "__BACKOFFICE_IMAGE_TAG__"
      labels:
        app.kubernetes.io/name: backoffice
        app.kubernetes.io/component: web
        seorilabs.dev/source-sha: "__BACKOFFICE_IMAGE_TAG__"
    spec:
      # data ns 인덱싱 Job 생성용(Discord /index). RBAC: k8s/vault-trigger-rbac.yaml
      serviceAccountName: backoffice
      nodeSelector:
        kubernetes.io/hostname: rpi5
      securityContext:
        fsGroup: 10001
      imagePullSecrets:
        - name: registry-pull-cred
      containers:
        - name: backoffice
          image: registry.vzyx.xyz/seorilabs/seorilabs-backoffice:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            # 일부 외부 API가 AAAA를 광고하지만 pod에 IPv6 egress가 없어 IPv4를 우선한다.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=640 --dns-result-order=ipv4first --no-network-family-autoselection"
            - name: HOME
              value: /tmp
            - name: CHECKPOINT_DISABLE
              value: "1"
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: AUTH_URL
              value: "https://backoffice.vzyx.xyz"
            - name: GITHUB_ORG
              value: seorilabs
            - name: PLATFORM_GITHUB_REPOSITORY_ID
              value: "1317999271"
            # .github repo-contract의 Fleet 표준 label catalog를 immutable source/blob/digest로 읽는다.
            # 값은 공개 trust root이며 label 정의를 Backoffice에 복사하지 않는다.
            - name: FLEET_STANDARD_LABELS_CONTRACT_REPOSITORY_ID
              value: "1241442018"
            - name: FLEET_STANDARD_LABELS_CONTRACT_SOURCE_SHA
              value: "0b6346713a64f6309fa32d1d3e09747c9db4ccb4"
            - name: FLEET_STANDARD_LABELS_CATALOG_BLOB_SHA
              value: "cfc0c5f52c87e1808264224cb55666896b51336c"
            - name: FLEET_STANDARD_LABELS_CATALOG_DIGEST
              value: "sha256:0968c206c075b06b54a47ca9dcf7be48f5f0e02ff7988d3fd6b029b8bcf66c22"
            - name: ALLOWLIST_LOGINS
              value: "magicsih"
            - name: FEATURE_GEMINI_ENABLED
              value: "true"
            - name: GEMINI_API_BASE_URL
              value: "https://generativelanguage.googleapis.com/v1beta"
            - name: GEMINI_CHAT_MODEL
              value: "gemini-3.1-flash-lite"
            - name: GEMINI_CHAT_TIMEOUT_MS
              value: "180000"
            # 일일 병합 목록은 항상 발송. Gemini 한 줄 요약만 날짜별 10% 슬로우 롤아웃.
            - name: DAILY_DIGEST_GEMINI_ROLLOUT_PERCENT
              value: "10"
            - name: GEMINI_EMBED_MODEL
              value: "gemini-embedding-001"
            - name: GEMINI_EMBED_DIM
              value: "1536"
            - name: GEMINI_TIMEOUT_MS
              value: "60000"
            # 서리 재무 리포트(/api/admin/finance-report)와 /ask 의 cost_summary 는
            # 웹 Pod 에서 돈다. GCP 월 예산(원) 70/90/100% 에서 경고한다.
            - name: GCP_MONTHLY_BUDGET_KRW
              value: "20000"
            # GA4→BigQuery 지표 수집(수집/보고 CronJob + /analytics 대시보드).
            - name: FEATURE_GA4_ANALYTICS
              value: "true"
            # 공통 플랫폼 조회. 웹 Pod에는 read 전용 Cloud Run invoker만 둔다.
            # 쓰기 키는 backoffice-app-ops-worker에만 주입한다.
            - name: FEATURE_PLATFORM_ADMIN
              value: "true"
            # worker·registry·catalog가 모두 준비돼 전환했다.
            #
            # 이 플래그는 화면만 연다. 웹 Pod에는 read 키만 있어서 켜도
            # 원장을 직접 쓰지 못한다. 실제 mutation은 write 자격증명을
            # 가진 backoffice-app-ops-worker가 실행한다.
            #
            # worker의 같은 이름 두 플래그와 항상 같은 값을 유지한다.
            - name: FEATURE_PLATFORM_ADMIN_WRITES
              value: "true"
            # iOS(App Store)를 Xcode Cloud 로 빌드/업로드하는 repo allowlist(CSV).
            # 정책: 모든 App Store 배포는 App Store Connect(Xcode Cloud)로 → TestFlight 검증 → 심사 제출.
            # iOS 를 출시하는 repo 는 Xcode Cloud 제품/워크플로 준비되는 대로 이 목록에 추가한다.
            - name: XCODE_CLOUD_APP_STORE_REPOS
              value: "seorilabs/happy-farm,seorilabs/crossword-puzzle,seorilabs/foam-party,seorilabs/babycare,seorilabs/lucid-chess,seorilabs/cycle-pair,seorilabs/slotmachine-game,seorilabs/lizard-tycoon,seorilabs/jomul,seorilabs/spiritgate-defenders,seorilabs/saju-reader,seorilabs/reascend"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: DATABASE_URL
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: AUTH_SECRET
            - name: AUTH_GITHUB_ID
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: AUTH_GITHUB_ID
            - name: AUTH_GITHUB_SECRET
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: AUTH_GITHUB_SECRET
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: GITHUB_APP_ID
            - name: GITHUB_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: GITHUB_PRIVATE_KEY
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: GITHUB_WEBHOOK_SECRET
            - name: INTERNAL_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: INTERNAL_ADMIN_TOKEN
            - name: CONTROL_PLANE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: CONTROL_PLANE_ADMIN_TOKEN
                  optional: true
            - name: CONTROL_PLANE_ADMIN_PRINCIPAL
              value: "backoffice:fleet-operator"
            - name: AGENT_WORKER_CODEX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: AGENT_WORKER_CODEX_TOKEN
                  optional: true
            - name: AGENT_WORKER_CLAUDE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: AGENT_WORKER_CLAUDE_TOKEN
                  optional: true
            - name: AGENT_TRUSTED_ADAPTER_PRINCIPAL
              value: "seori-auth:github-adapter"
            - name: AGENT_TRUSTED_ADAPTER_RUNTIME_IDENTITY
              value: "spiffe://seorilabs.local/ns/auth-broker/sa/seori-auth-github-adapter"
            # k8s/seori-auth-agent-runtime.yaml은 기본 replicas=0이다. durable step ledger와
            # signed readback canary 확인 전에는 code gate까지 READY_PR을 fail-closed한다.
            - name: AGENT_TRUSTED_ADAPTER_DEPLOYED
              value: "false"
            # 후보 executor는 별도 suspended CronJob과 App permission canary를 통과한
            # 뒤에만 켠다. generic READY_PR runtime gate와 서로 승격시키지 않는다.
            - name: WORKFLOW_BUNDLE_CANDIDATE_EXECUTOR_DEPLOYED
              value: "false"
            - name: AGENT_TRUSTED_ADAPTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: AGENT_TRUSTED_ADAPTER_TOKEN
                  optional: true
            - name: AGENT_TRUSTED_ADAPTER_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: AGENT_TRUSTED_ADAPTER_PUBLIC_KEY
                  optional: true
            - name: CONTROL_PLANE_SNAPSHOT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: backoffice-control-plane-snapshot-signing
                  key: CONTROL_PLANE_SNAPSHOT_SIGNING_KEY
                  optional: true
            - name: CONTROL_PLANE_SNAPSHOT_SIGNING_KEY_ID
              value: "control-plane-snapshot-v1"
            - name: CONTROL_PLANE_SNAPSHOT_SIGNATURE_POLICY_REVISION
              value: "snapshot-policy-v1"
            # 공개 Ed25519 trust root다. fleet-approved.json이 발행돼도 이
            # ConfigMap이 없거나 ACTIVE key가 아니면 release 입력을 거부한다.
            - name: PLATFORM_FLEET_APPROVAL_PUBLIC_KEYS_JSON
              valueFrom:
                configMapKeyRef:
                  name: backoffice-platform-fleet-trust
                  key: trusted-release-keys.json
                  optional: true
            # WorkflowBundle v5 승인 signer의 공개 metadata다. private key는
            # Auth Broker signer 경계에만 있고 Backoffice에는 주입하지 않는다.
            - name: WORKFLOW_BUNDLE_V5_APPROVAL_PUBLIC_KEYS_JSON
              valueFrom:
                configMapKeyRef:
                  name: backoffice-workflow-bundle-v5-trust
                  key: trusted-approval-keys.json
                  optional: true
            # 챗/초안 + 볼트 검색 질의 임베딩. 인덱서는 data ns 별도 키를 사용.
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: GEMINI_API_KEY
            # GA4 BigQuery 읽기 SA 키(JSON 전체). 없으면 지표 수집이 비활성.
            # 종량제 비용 소스. 전부 optional — 미설정 소스는 리포트에 "미설정" 으로 뜬다.
            # GITHUB_BILLING_TOKEN 은 조직 billing 읽기 전용 fine-grained PAT
            # (신형 청구 API 는 GitHub App 토큰을 받지 않는다).
            - name: GITHUB_BILLING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: GITHUB_BILLING_TOKEN
                  optional: true
            - name: GCP_BILLING_EXPORT_TABLE
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: GCP_BILLING_EXPORT_TABLE
                  optional: true
            - name: STABILITY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: STABILITY_API_KEY
                  optional: true
            - name: GA4_SA_KEY_JSON
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: GA4_SA_KEY_JSON
                  optional: true
            - name: PLATFORM_ADMIN_URL
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: PLATFORM_ADMIN_URL
                  optional: true
            - name: PLATFORM_ADMIN_READ_SA_KEY_JSON
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: PLATFORM_ADMIN_READ_SA_KEY_JSON
                  optional: true
            # Interaction webhook은 공개키로 검증하고, 쓰기는 별도 worker가 Bot token으로 수행한다.
            - name: DISCORD_PUBLIC_KEY
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_PUBLIC_KEY } }
            - name: DISCORD_GUILD_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_GUILD_ID } }
            # Discord interaction 스코프 검사에 쓰인다. 버튼은 카드가 놓인 채널에서 눌리므로
            # 카드를 보내는 채널 ID 가 여기 없으면 그 채널의 버튼이 전부 거부된다.
            # 목록은 roles.ts 의 DISCORD_CARD_CHANNEL_KEYS 와 일치해야 한다.
            - name: DISCORD_CHANNEL_BACKOFFICE_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_CHANNEL_BACKOFFICE_ID } }
            - name: DISCORD_CHANNEL_RELEASE_OPS_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_CHANNEL_RELEASE_OPS_ID } }
            - name: DISCORD_CHANNEL_OPS_ALERTS_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_CHANNEL_OPS_ALERTS_ID } }
            - name: DISCORD_CHANNEL_METRICS_DAILY_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_CHANNEL_METRICS_DAILY_ID } }
            # 담당제 통합 운영 채널 — confirm 카드 버튼 allowlist 검증에 필요.
            - name: DISCORD_CHANNEL_APP_OPS_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_CHANNEL_APP_OPS_ID, optional: true } }
            - name: DISCORD_ROLE_OPERATIONS_ADMIN_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_ROLE_OPERATIONS_ADMIN_ID } }
            - name: DISCORD_ROLE_OPERATOR_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_ROLE_OPERATOR_ID } }
            - name: DISCORD_ROLE_PRODUCT_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_ROLE_PRODUCT_ID } }
            - name: DISCORD_ROLE_DESIGN_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_ROLE_DESIGN_ID } }
            - name: DISCORD_ROLE_DEVELOPMENT_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_ROLE_DEVELOPMENT_ID } }
            - name: DISCORD_ROLE_QA_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_ROLE_QA_ID } }
            - name: DISCORD_ROLE_DATA_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_ROLE_DATA_ID } }
            - name: DISCORD_ROLE_RELEASE_OPS_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_ROLE_RELEASE_OPS_ID } }
            - name: DISCORD_ROLE_CS_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_ROLE_CS_ID } }
            - name: DISCORD_ROLE_VIEWER_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_ROLE_VIEWER_ID } }
            - name: PLATFORM_EVENT_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: PLATFORM_EVENT_SHARED_SECRET
                  optional: true
            # App Store Connect API 팀 키(Xcode Cloud iOS 빌드 트리거용).
            - name: APP_STORE_CONNECT_API_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: APP_STORE_CONNECT_API_KEY_ID
                  optional: true
            - name: APP_STORE_CONNECT_ISSUER_ID
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: APP_STORE_CONNECT_ISSUER_ID
                  optional: true
            - name: APP_STORE_CONNECT_PRIVATE_KEY_BASE64
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: APP_STORE_CONNECT_PRIVATE_KEY_BASE64
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
