# backoffice 웹 Deployment. CI(deploy.yml)가 선언적으로 apply 한다.
#
# Service·ServiceMonitor·Ingress 는 k8s/backoffice-networking.yaml 로 분리했다.
# 배포 SA 에 그 리소스 write 권한이 없어 한 파일이면 apply 가 실패한다.
# 그래서 예전에는 이 파일을 apply 하지 않고 set image 로 이미지만 갱신했고,
# 여기 적은 env 가 클러스터에 영영 가지 않았다.
#
# 이제 이 파일에 값을 적으면 다음 배포에 반영된다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backoffice
  namespace: platform
  labels:
    app.kubernetes.io/name: backoffice
spec:
  replicas: 1
  # 단일 replica + RWO 미러 DB. 스케줄러 중복/롤아웃 데드락 방지 위해 Recreate.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backoffice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backoffice
    spec:
      # data ns 인덱싱 Job 생성용(Discord /index). RBAC: k8s/vault-trigger-rbac.yaml
      serviceAccountName: backoffice
      nodeSelector:
        kubernetes.io/hostname: rpi5
      securityContext:
        fsGroup: 10001
      imagePullSecrets:
        - name: registry-pull-cred
      initContainers:
        - name: migrate
          image: registry.vzyx.xyz/seorilabs/seorilabs-backoffice:latest
          imagePullPolicy: Always
          command: ["prisma", "migrate", "deploy"]
          env:
            - name: HOME
              value: /tmp
            - name: CHECKPOINT_DISABLE
              value: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: DATABASE_URL
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: backoffice
          image: registry.vzyx.xyz/seorilabs/seorilabs-backoffice:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            # 일부 외부 API가 AAAA를 광고하지만 pod에 IPv6 egress가 없어 IPv4를 우선한다.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=640 --dns-result-order=ipv4first --no-network-family-autoselection"
            - name: HOME
              value: /tmp
            - name: CHECKPOINT_DISABLE
              value: "1"
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: AUTH_URL
              value: "https://backoffice.vzyx.xyz"
            - name: GITHUB_ORG
              value: seorilabs
            - name: ALLOWLIST_LOGINS
              value: "magicsih"
            - name: FEATURE_GEMINI_ENABLED
              value: "true"
            - name: GEMINI_API_BASE_URL
              value: "https://generativelanguage.googleapis.com/v1beta"
            - name: GEMINI_CHAT_MODEL
              value: "gemini-3.1-flash-lite"
            - name: GEMINI_CHAT_TIMEOUT_MS
              value: "180000"
            # 일일 병합 목록은 항상 발송. Gemini 한 줄 요약만 날짜별 10% 슬로우 롤아웃.
            - name: DAILY_DIGEST_GEMINI_ROLLOUT_PERCENT
              value: "10"
            - name: GEMINI_EMBED_MODEL
              value: "gemini-embedding-001"
            - name: GEMINI_EMBED_DIM
              value: "1536"
            - name: GEMINI_TIMEOUT_MS
              value: "60000"
            - name: RECONCILE_INTERVAL_MS
              value: "21600000"
            # GA4→BigQuery 지표 수집(수집/보고 CronJob + /analytics 대시보드).
            - name: FEATURE_GA4_ANALYTICS
              value: "true"
            # 공통 플랫폼 조회. 웹 Pod에는 read 전용 Cloud Run invoker만 둔다.
            # 쓰기 키는 backoffice-app-ops-worker에만 주입한다.
            - name: FEATURE_PLATFORM_ADMIN
              value: "true"
            # worker·registry·catalog가 모두 준비돼 전환했다.
            #
            # 이 플래그는 화면만 연다. 웹 Pod에는 read 키만 있어서 켜도
            # 원장을 직접 쓰지 못한다. 실제 mutation은 write 자격증명을
            # 가진 backoffice-app-ops-worker가 실행한다.
            #
            # worker의 같은 이름 두 플래그와 항상 같은 값을 유지한다.
            - name: FEATURE_PLATFORM_ADMIN_WRITES
              value: "true"
            # iOS(App Store)를 Xcode Cloud 로 빌드/업로드하는 repo allowlist(CSV).
            # 정책: 모든 App Store 배포는 App Store Connect(Xcode Cloud)로 → TestFlight 검증 → 심사 제출.
            # iOS 를 출시하는 repo 는 Xcode Cloud 제품/워크플로 준비되는 대로 이 목록에 추가한다.
            - name: XCODE_CLOUD_APP_STORE_REPOS
              value: "seorilabs/happy-farm,seorilabs/crossword-puzzle,seorilabs/foam-party,seorilabs/babycare,seorilabs/lucid-chess,seorilabs/cycle-pair,seorilabs/slotmachine-game,seorilabs/lizard-tycoon,seorilabs/jomul,seorilabs/spiritgate-defenders"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: DATABASE_URL
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: AUTH_SECRET
            - name: AUTH_GITHUB_ID
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: AUTH_GITHUB_ID
            - name: AUTH_GITHUB_SECRET
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: AUTH_GITHUB_SECRET
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: GITHUB_APP_ID
            - name: GITHUB_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: GITHUB_PRIVATE_KEY
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: GITHUB_WEBHOOK_SECRET
            - name: INTERNAL_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: INTERNAL_ADMIN_TOKEN
            # 챗/초안 + 볼트 검색 질의 임베딩. 인덱서는 data ns 별도 키를 사용.
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: GEMINI_API_KEY
            # GA4 BigQuery 읽기 SA 키(JSON 전체). 없으면 지표 수집이 비활성.
            - name: GA4_SA_KEY_JSON
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: GA4_SA_KEY_JSON
                  optional: true
            - name: PLATFORM_ADMIN_URL
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: PLATFORM_ADMIN_URL
                  optional: true
            - name: PLATFORM_ADMIN_READ_SA_KEY_JSON
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: PLATFORM_ADMIN_READ_SA_KEY_JSON
                  optional: true
            # Interaction webhook은 공개키로 검증하고, 쓰기는 별도 worker가 Bot token으로 수행한다.
            - name: DISCORD_PUBLIC_KEY
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_PUBLIC_KEY } }
            - name: DISCORD_GUILD_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_GUILD_ID } }
            - name: DISCORD_CHANNEL_BACKOFFICE_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_CHANNEL_BACKOFFICE_ID } }
            - name: DISCORD_ROLE_OPERATIONS_ADMIN_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_ROLE_OPERATIONS_ADMIN_ID } }
            - name: DISCORD_ROLE_OPERATOR_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_ROLE_OPERATOR_ID } }
            - name: DISCORD_ROLE_PRODUCT_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_ROLE_PRODUCT_ID } }
            - name: DISCORD_ROLE_DESIGN_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_ROLE_DESIGN_ID } }
            - name: DISCORD_ROLE_DEVELOPMENT_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_ROLE_DEVELOPMENT_ID } }
            - name: DISCORD_ROLE_QA_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_ROLE_QA_ID } }
            - name: DISCORD_ROLE_DATA_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_ROLE_DATA_ID } }
            - name: DISCORD_ROLE_RELEASE_OPS_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_ROLE_RELEASE_OPS_ID } }
            - name: DISCORD_ROLE_CS_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_ROLE_CS_ID } }
            - name: DISCORD_ROLE_VIEWER_ID
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: DISCORD_ROLE_VIEWER_ID } }
            - name: GRAFANA_ALERT_HMAC_SECRET
              valueFrom: { secretKeyRef: { name: backoffice-secrets, key: GRAFANA_ALERT_HMAC_SECRET } }
            - name: PLATFORM_EVENT_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: PLATFORM_EVENT_SHARED_SECRET
                  optional: true
            # App Store Connect API 팀 키(Xcode Cloud iOS 빌드 트리거용).
            - name: APP_STORE_CONNECT_API_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: APP_STORE_CONNECT_API_KEY_ID
                  optional: true
            - name: APP_STORE_CONNECT_ISSUER_ID
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: APP_STORE_CONNECT_ISSUER_ID
                  optional: true
            - name: APP_STORE_CONNECT_PRIVATE_KEY_BASE64
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: APP_STORE_CONNECT_PRIVATE_KEY_BASE64
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
