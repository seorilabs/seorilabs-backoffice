# 등록된 운영자만 적용한다. CI 배포 계정의 권한을 늘리지 않는다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backoffice-batch-observer
  namespace: platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backoffice-batch-observer
rules:
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backoffice-batch-observer
  namespace: platform
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: backoffice-batch-observer }
subjects: [{ kind: ServiceAccount, name: backoffice-batch-observer, namespace: platform }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backoffice-batch-observer
  namespace: data
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: backoffice-batch-observer }
subjects: [{ kind: ServiceAccount, name: backoffice-batch-observer, namespace: platform }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backoffice-batch-observer
  namespace: container-registry
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: backoffice-batch-observer }
subjects: [{ kind: ServiceAccount, name: backoffice-batch-observer, namespace: platform }]
