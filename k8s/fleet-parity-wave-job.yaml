# 운영자가 distinct Job을 만들 때마다 metadata.uid를 occurrence key로 사용하는
# one-shot Fleet parity wave. deploy-backoffice.sh가 자동 적용하지 않는다.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: backoffice-fleet-parity-__BACKOFFICE_IMAGE_TAG_SHORT__-
  namespace: platform
  labels:
    app.kubernetes.io/name: backoffice
    app.kubernetes.io/component: fleet-parity
    seorilabs.dev/source-sha: "__BACKOFFICE_IMAGE_TAG__"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backoffice
        app.kubernetes.io/component: fleet-parity
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: rpi5
      imagePullSecrets:
        - name: registry-pull-cred
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: parity-wave
          image: registry.vzyx.xyz/seorilabs/seorilabs-backoffice:latest
          imagePullPolicy: Always
          command: ["node", "/app/scripts-dist/fleet-parity-wave.cjs"]
          env:
            - name: NODE_ENV
              value: production
            - name: HOME
              value: /tmp
            - name: CHECKPOINT_DISABLE
              value: "1"
            - name: GITHUB_ORG
              value: seorilabs
            - name: PLATFORM_GITHUB_REPOSITORY_ID
              value: "1317999271"
            - name: FLEET_PARITY_PRINCIPAL
              value: k8s:fleet-parity-wave
            # 같은 Job의 retry는 같은 UID라 새 wave로 세지 않는다.
            - name: FLEET_PARITY_OCCURRENCE_KEY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: DATABASE_URL
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: backoffice-secrets
                  key: GITHUB_APP_ID
            - name: GITHUB_PRIVATE_KEY_FILE
              value: /run/secrets/github/private-key
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: github-private-key
              mountPath: /run/secrets/github
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: github-private-key
          secret:
            secretName: backoffice-secrets
            defaultMode: 0440
            items:
              - key: GITHUB_PRIVATE_KEY
                path: private-key
        - name: tmp
          emptyDir: {}
