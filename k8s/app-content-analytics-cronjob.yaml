# 앱 컨텐츠 세부 지표 수집 — BigQuery 를 쿼리해 AppContentMetricDaily 스냅샷 upsert.
# 공통 지표 collect(01:00 UTC) 직후, report(01:30 UTC) 전에 돌려 대시보드 컨텐츠 섹션이
# 같은 D-1 기준으로 채워지게 한다. 공통 지표와 독립 route/독립 CronJob 이라 한쪽이
# 실패해도 서로 영향 없다. 신규 파일로 분리(공유 매니페스트 무편집).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backoffice-app-content-analytics-collect
  namespace: platform
  labels:
    app.kubernetes.io/name: backoffice
spec:
  schedule: "15 1 * * *" # 매일 01:15 UTC = 10:15 KST (공통 지표 수집 직후)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 330
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: trigger
              image: curlimages/curl:8.11.1
              command:
                - sh
                - -c
                - >-
                  curl -fsS --max-time 300 -XPOST
                  -H "x-admin-token: $ADMIN_TOKEN"
                  http://backoffice.platform.svc.cluster.local/api/admin/analytics/app-content-collect
              env:
                - name: ADMIN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: backoffice-secrets
                      key: INTERNAL_ADMIN_TOKEN
              securityContext:
                runAsUser: 10001
                runAsGroup: 10001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
