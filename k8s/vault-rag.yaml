# Vault RAG — 고정 인덱싱 실행기와 일일 writer.
# data namespace의 등록된 기존 실행 자격증명과 rpi5 Syncthing PVC를 재사용한다.
# 적용 전 구 CronJob drain과 앱 SA 권한 제거 순서는 docs/DEPLOY.md #185를 따른다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-indexer
  namespace: data
  labels:
    app.kubernetes.io/name: backoffice
    app.kubernetes.io/component: vault-indexer
spec:
  replicas: 1
  progressDeadlineSeconds: 3300
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: vault-indexer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backoffice
        app.kubernetes.io/component: vault-indexer
    spec:
      nodeSelector:
        kubernetes.io/hostname: rpi5
      imagePullSecrets:
        - name: registry-pull-cred
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: indexer
          image: registry.vzyx.xyz/seorilabs/seorilabs-backoffice:latest
          imagePullPolicy: Always
          workingDir: /app
          command:
            - node
            - /app/scripts-dist/index-vault.cjs
          env:
            - name: HOME
              value: /tmp
            - name: CHECKPOINT_DISABLE
              value: "1"
            - name: GEMINI_API_BASE_URL
              value: https://generativelanguage.googleapis.com/v1beta
            - name: GEMINI_EMBED_MODEL
              value: gemini-embedding-001
            - name: GEMINI_EMBED_DIM
              value: "1536"
            - name: VAULT_PATH
              value: /vault
            - name: VAULT_INCLUDE_DIRS
              value: 받은함,지식,커리어,프로젝트
            - name: VAULT_EXCLUDE_DIRS
              value: .obsidian,.stfolder,.trash
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backoffice-vault-secrets
                  key: DATABASE_URL
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backoffice-vault-secrets
                  key: GEMINI_API_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: vault
              mountPath: /vault
              subPath: Sync/obsidian-main
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: vault
          persistentVolumeClaim:
            claimName: syncthing-pvc
        - name: tmp
          emptyDir: {}
      serviceAccountName: vault-indexer
      terminationGracePeriodSeconds: 3030
---
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-writer
  namespace: data
  labels:
    app.kubernetes.io/name: backoffice
    app.kubernetes.io/component: vault-writer
spec:
  schedule: "30 4 * * *" # 매일 KST 04:30 PENDING 쓰기 요청 드레인.
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backoffice
            app.kubernetes.io/component: vault-writer
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: rpi5
          imagePullSecrets:
            - name: registry-pull-cred
          securityContext:
            # 받은함/ 에 기록하려면 소유자(uid 1000)로 실행해야 함.
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: writer
              image: registry.vzyx.xyz/seorilabs/seorilabs-backoffice:latest
              imagePullPolicy: Always
              workingDir: /app
              command: ["node", "/app/scripts-dist/vault-writer.cjs"]
              env:
                - name: HOME
                  value: /tmp
                - name: CHECKPOINT_DISABLE
                  value: "1"
                - name: VAULT_PATH
                  value: /vault
                - name: VAULT_WRITE_FOLDERS
                  value: "받은함,프로젝트/지표"
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: backoffice-vault-secrets
                      key: DATABASE_URL
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 384Mi
              volumeMounts:
                - name: vault
                  mountPath: /vault
                  subPath: Sync/obsidian-main
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: vault
              persistentVolumeClaim:
                claimName: syncthing-pvc
            - name: tmp
              emptyDir: {}
