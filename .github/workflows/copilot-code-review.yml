# Copilot 코드 리뷰를 ARC 자체호스팅 러너에서 실행한다.
#
# 이 파일이 없으면 Copilot 리뷰는 GitHub-hosted ubuntu-latest 에서 돌아 포함 분량을
# 소모한다(org 전체 451분/월). 또 hosted 러너 배정이 늦으면 "couldn't run its full
# agentic review because it didn't start before the timeout" 로 축약 실행된다.
#
# 제약 두 가지.
#   - GitHub 은 이 용도에 ARC 로 관리되는 자체호스팅 러너만 허용한다(비-ARC 금지).
#   - 잡 이름은 반드시 copilot-setup-steps 여야 Copilot 이 인식한다.
#
# setup step 은 최소로 둔다. 리뷰 대상 체크아웃은 Copilot 이 이 잡 뒤에 스스로 하고,
# 여기에 의존성 설치를 넣으면 리뷰마다 ARC 러너(max 3)를 오래 점유해 CI 를 밀어낸다.
name: Copilot Code Review

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-code-review.yml
  pull_request:
    paths:
      - .github/workflows/copilot-code-review.yml

jobs:
  copilot-setup-steps:
    runs-on: seorilabs-rpi-arm64
    permissions:
      contents: read
    steps:
      - name: Runner ready
        run: echo "Copilot review runs on ${{ runner.name }} (${{ runner.os }}/${{ runner.arch }})"
