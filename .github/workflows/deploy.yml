name: Deploy

# main push 시 검증→이미지 빌드→배포. 사전: REGISTRY_USERNAME/PASSWORD, KUBECONFIG_B64 secret
# (DEPLOY.md §7). 전 잡이 GitHub-hosted 이며 self-hosted 러너 그룹 등록은 필요 없다.
# KUBECONFIG_B64 의 server 는 hosted 러너에서 닿는 공개 엔드포인트여야 한다.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 검증과 immutable image build 뒤 production에 배포한다
        required: true
        type: boolean
        default: true
  push:
    branches: [main]

concurrency:
  group: deploy-backoffice
  cancel-in-progress: false

env:
  IMAGE: registry.vzyx.xyz/seorilabs/seorilabs-backoffice
  # Docker 자동 build record도 중앙 release policy의 3일 보존을 적용한다.
  DOCKER_BUILD_RECORD_RETENTION_DAYS: "3"

jobs:
  verify:
    # PR 에서 통과한 Next build 는 반복하지 않는다. main 직접 push까지 보호하는
    # 정적 게이트만 실행하고, 실제 production build 는 아래 Docker job이 한 번 맡는다.
    # kubectl 을 부르는 검증 스크립트는 전부 KUBECTL_BIN 에 stub 을 주입한다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24.16.0"
          check-latest: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: bash scripts/check-migration-safety.test.sh
      - run: bash scripts/check-migration-safety.sh
        env:
          MIGRATION_FROZEN_BASE: ${{ github.event.before }}
      - run: bash scripts/render-manifest.test.sh
      - run: bash scripts/deploy-backoffice.test.sh
      - run: bash scripts/run-restore-rehearsal.test.sh
      - run: bash scripts/check-ci-deployer-permissions.test.sh

  migration-contract:
    uses: ./.github/workflows/migration-contract.yml
    permissions:
      contents: read

  build:
    needs: [verify, migration-contract]
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    # 이미지 빌드는 클러스터 자원이 필요 없다. registry.vzyx.xyz 는 TLS 로 공개
    # 도달 가능하므로 hosted 에서 push 한다. arm64 이미지는 Dockerfile 의
    # BUILDPLATFORM 크로스빌드로 만든다.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # 런타임 스테이지(apt/useradd/prisma CLI)만 arm64 로 실행된다. 의존성 설치와
      # next build 는 Dockerfile 의 BUILDPLATFORM 스테이지에서 러너 네이티브로 돈다.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      # 예전에는 클러스터 안의 buildkitd 를 remote driver 로 썼다. 러너가 클러스터를
      # 떠났으므로 러너 안의 기본 driver 를 쓴다.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: registry.vzyx.xyz
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          # Actions cache는 push마다 BuildKit blob을 별도 보관해 조직 저장공간을
          # 소진하므로 사용하지 않는다. mode=min과 같은 최종 이미지 레이어 캐시는
          # registry의 단일 mutable buildcache tag에 inline으로 보관한다.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=inline
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:buildcache
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Record immutable candidate
        run: echo "image=${IMAGE}@${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.deploy
    needs: build
    # k8s API(k8s.vzyx.xyz:16443)는 공개 도달 가능하고 kubeconfig 에 CA 가 들어 있다.
    # 첫 kubectl 동작이 auth whoami 라 접속·신원이 어긋나면 아무것도 바꾸기 전에
    # fail-closed 된다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # k8s 매니페스트 apply 를 위해 레포 파일 필요
      - name: Deploy to platform ns
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x /tmp/kubectl
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          # 배포 kubeconfig의 실제 권한 경계를 먼저 확인한다. data namespace workload를
          # 바꿀 수 있으면 임의 Secret volume을 붙일 수 있어 배포를 진행하지 않는다.
          KUBECTL_BIN=/tmp/kubectl scripts/check-ci-deployer-permissions.sh
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "invalid image digest" >&2
            exit 1
          fi
          IMG="${IMAGE}@${IMAGE_DIGEST}"
          KUBECTL_BIN=/tmp/kubectl \
            BACKOFFICE_IMAGE="$IMG" \
            BACKOFFICE_SOURCE_SHA="$SHA" \
            scripts/deploy-backoffice.sh
