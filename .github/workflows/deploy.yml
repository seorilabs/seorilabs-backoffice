name: Deploy

# main push 시 자동 빌드→배포. 사전: REGISTRY_USERNAME/PASSWORD, KUBECONFIG_B64 secret
# + 레포를 ARC "RPI ARM64 Builders" 러너 그룹에 추가 (DEPLOY.md §7).
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-backoffice
  cancel-in-progress: false

env:
  IMAGE: registry.vzyx.xyz/seorilabs/seorilabs-backoffice

jobs:
  build:
    # ARM64 Docker 빌드 → -dind 러너(rpi4001)에서 격리.
    runs-on: seorilabs-rpi-arm64-dind
    steps:
      - uses: actions/checkout@v6
      # 클러스터 내 영구 BuildKit 데몬을 remote 빌더로 사용 → pnpm store/.next/cache/레이어
      # 캐시가 PVC 에 지속되어 증분 빌드(ephemeral 러너 사이로 유지).
      - uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://buildkitd.platform.svc.cluster.local:1234
      - uses: docker/login-action@v3
        with:
          registry: registry.vzyx.xyz
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    needs: build
    runs-on: seorilabs-rpi-arm64
    steps:
      - name: Deploy to platform ns
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/arm64/kubectl"
          chmod +x /tmp/kubectl
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          IMG="${IMAGE}:${SHA}"
          # 선언적 리소스(SealedSecret/CronJob) 적용 — 매니페스트 변경이 배포에 자동 반영되게.
          # 새 CronJob/SealedSecret 등 앱 매니페스트를 추가하면 이 목록에도 넣는다.
          # 제외: deployment(아래 set image 로 이미지만 갱신), PVC 포함 매니페스트
          # (backup-cronjob/buildkitd — immutable 필드로 apply 실패 위험), 인프라
          # (vault-*/rbac), secret.example.yaml(placeholder — 실제 secret 덮을 위험).
          for m in \
            backoffice-sealedsecret.yaml \
            proactive-cronjobs.yaml \
            app-content-analytics-cronjob.yaml; do
            /tmp/kubectl apply -f "k8s/$m"
          done
          /tmp/kubectl -n platform set image deployment/backoffice migrate="$IMG" backoffice="$IMG"
          /tmp/kubectl -n platform rollout status deployment/backoffice --timeout=300s
