name: Deploy

# main push 시 자동 빌드→배포. 사전: REGISTRY_USERNAME/PASSWORD, KUBECONFIG_B64 secret
# + 레포를 ARC "RPI ARM64 Builders" 러너 그룹에 추가 (DEPLOY.md §7).
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-backoffice
  cancel-in-progress: false

env:
  IMAGE: registry.vzyx.xyz/seorilabs/seorilabs-backoffice

jobs:
  build:
    # ARM64 Docker 빌드 → -dind 러너(rpi4001)에서 격리.
    runs-on: seorilabs-rpi-arm64-dind
    steps:
      - uses: actions/checkout@v7
      # 클러스터 내 영구 BuildKit 데몬을 remote 빌더로 사용 → pnpm store/.next/cache/레이어
      # 캐시가 PVC 에 지속되어 증분 빌드(ephemeral 러너 사이로 유지).
      - uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://buildkitd.platform.svc.cluster.local:1234
      - uses: docker/login-action@v3
        with:
          registry: registry.vzyx.xyz
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    needs: build
    runs-on: seorilabs-rpi-arm64
    steps:
      - uses: actions/checkout@v7 # k8s 매니페스트 apply 를 위해 레포 파일 필요
      - name: Deploy to platform ns
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/arm64/kubectl"
          chmod +x /tmp/kubectl
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          IMG="${IMAGE}:${SHA}"

          # 매니페스트의 :latest 를 이번 빌드 SHA 로 바꿔 내보낸다.
          #
          # apply 뒤에 set image 로 고치는 방법도 되지만, 그 사이 :latest 로
          # 한 번 rollout 이 돌아 노드 캐시에 남은 예전 :latest 가 잠깐
          # 뜰 수 있다. imagePullPolicy 가 Always 라도 창은 남는다.
          # 치환해서 한 번만 굴린다.
          #
          # 치환이 조용히 빗나가면 :latest 로 배포된다. 그래서 확인하고 죽는다.
          render() {
            local f="k8s/$1"
            if ! grep -q "${IMAGE}:latest" "$f"; then
              echo "::error::$f 에 ${IMAGE}:latest 가 없다. 이미지 치환이 깨졌다."
              exit 1
            fi
            sed "s|${IMAGE}:latest|${IMG}|g" "$f"
          }

          # 매니페스트를 선언적으로 적용한다 — 파일 변경이 배포에 자동 반영되게.
          #
          # 예전에는 deployment.yaml 을 제외하고 set image 로 이미지만 갱신했다.
          # 그래서 매니페스트에 적은 env 가 클러스터에 영영 가지 않았다.
          # FEATURE_PLATFORM_ADMIN_WRITES 와 DAILY_DIGEST_GEMINI_ROLLOUT_PERCENT 가
          # 실제로 그 상태로 남아 있었고, 매니페스트만 보면 켜져 있는 줄 안다.
          #
          # 새 매니페스트를 추가하면 이 목록에도 넣는다. ci-deployer Role 에
          # 해당 리소스 write 권한이 필요하다(k8s/ci-deployer-rbac.yaml).
          #
          # 제외 — 전부 수동 apply 대상이다:
          #   backoffice-networking.yaml  Service/ServiceMonitor/Ingress. 배포 SA 에
          #                               권한을 주지 않으려고 deployment.yaml 에서 분리했다
          #   SealedSecret                secret write 권한 안 줌
          #   PVC 포함                    backup-cronjob, buildkitd
          #   인프라                      vault-*, rbac, secret.example.yaml
          for m in \
            proactive-cronjobs.yaml \
            app-content-analytics-cronjob.yaml; do
            /tmp/kubectl apply -f "k8s/$m"
          done
          render deployment.yaml | /tmp/kubectl apply -f -
          /tmp/kubectl -n platform rollout status deployment/backoffice --timeout=300s
          # DB migration이 완료된 뒤 queue worker를 생성/갱신한다.
          render app-ops-worker.yaml | /tmp/kubectl apply -f -
          /tmp/kubectl -n platform rollout status deployment/backoffice-app-ops-worker --timeout=300s
