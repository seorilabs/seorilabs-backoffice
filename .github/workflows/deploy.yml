name: Deploy

# main push 시 검증→이미지 빌드→배포. 사전: REGISTRY_USERNAME/PASSWORD, KUBECONFIG_B64 secret
# + 레포를 ARC "RPI ARM64 Builders" 러너 그룹에 추가 (DEPLOY.md §7).
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 검증과 immutable image build 뒤 production에 배포한다
        required: true
        type: boolean
        default: true
  push:
    branches: [main]

concurrency:
  group: deploy-backoffice
  cancel-in-progress: false

env:
  IMAGE: registry.vzyx.xyz/seorilabs/seorilabs-backoffice

jobs:
  verify:
    # PR 에서 통과한 Next build 는 반복하지 않는다. main 직접 push까지 보호하는
    # 정적 게이트만 실행하고, 실제 production build 는 아래 Docker job이 한 번 맡는다.
    runs-on: seorilabs-rpi-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24.16.0"
          check-latest: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: bash scripts/check-migration-safety.test.sh
      - run: bash scripts/check-migration-safety.sh
        env:
          MIGRATION_FROZEN_BASE: ${{ github.event.before }}
      - run: bash scripts/render-manifest.test.sh
      - run: bash scripts/deploy-backoffice.test.sh

  migration-contract:
    uses: ./.github/workflows/migration-contract.yml
    permissions:
      contents: read

  build:
    needs: [verify, migration-contract]
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    # ARM64 Docker 빌드 → -dind 러너(rpi5)에서 격리.
    runs-on: seorilabs-rpi-arm64-dind
    steps:
      - uses: actions/checkout@v7
      # 클러스터 내 영구 BuildKit 데몬을 remote 빌더로 사용 → pnpm store/.next/cache/레이어
      # 캐시가 PVC 에 지속되어 증분 빌드(ephemeral 러너 사이로 유지).
      - uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://buildkitd.platform.svc.cluster.local:1234
      - uses: docker/login-action@v4
        with:
          registry: registry.vzyx.xyz
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Record immutable candidate
        run: echo "image=${IMAGE}@${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.deploy
    needs: build
    runs-on: seorilabs-rpi-arm64
    steps:
      - uses: actions/checkout@v7 # k8s 매니페스트 apply 를 위해 레포 파일 필요
      - name: Deploy to platform ns
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/arm64/kubectl"
          chmod +x /tmp/kubectl
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "invalid image digest" >&2
            exit 1
          fi
          IMG="${IMAGE}@${IMAGE_DIGEST}"
          KUBECTL_BIN=/tmp/kubectl \
            BACKOFFICE_IMAGE="$IMG" \
            BACKOFFICE_SOURCE_SHA="$SHA" \
            scripts/deploy-backoffice.sh
