name: CI

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: seorilabs-rpi-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.16.0"
          check-latest: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: bash scripts/check-migration-safety.test.sh
      - run: bash scripts/check-migration-safety.sh
      # 배포 이미지 치환 계약. 여기서 조용히 빗나가면 :latest 로 배포되고
      # 어떤 코드가 도는지 알 수 없게 된다.
      - run: bash scripts/render-manifest.test.sh
      - run: bash scripts/deploy-backoffice.test.sh
      - run: pnpm build
        env:
          DATABASE_URL: mysql://build:build@127.0.0.1:3306/build
