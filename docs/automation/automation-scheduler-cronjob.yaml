# 설치 전 사용자 승인이 필요한 비활성 template이다. 배포 manifest에는 포함되지 않는다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backoffice-automation-scheduler
  namespace: platform
spec:
  schedule: "* * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 55
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: rpi5
          containers:
            - name: trigger
              image: curlimages/curl@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
              command:
                - sh
                - -c
                - >-
                  token="$(cat /var/run/secrets/seorilabs/admin-token)" &&
                  printf 'header = "x-admin-token: %s"\n' "$token" |
                  curl --config - -fsS -o /dev/null --max-time 50 -XPOST
                  http://backoffice.platform.svc.cluster.local/api/admin/automation/schedule
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: admin-token
                  mountPath: /var/run/secrets/seorilabs
                  readOnly: true
          volumes:
            - name: admin-token
              secret:
                secretName: backoffice-secrets
                defaultMode: 0440
                items:
                  - key: INTERNAL_ADMIN_TOKEN
                    path: admin-token
